  async function extractZipEntry(zip, name) {
    const entry = zip.entries[name];
    if (!entry) return null;
    const { view, bytes } = zip;
    const lh = entry.localHeaderOffset;
    if (view.getUint32(lh, true) !== 0x04034b50) throw new Error("corrupt entry: " + name);
    const nameLen = view.getUint16(lh + 26, true);
    const extraLen = view.getUint16(lh + 28, true);
    const dataStart = lh + 30 + nameLen + extraLen;
    const compressed = bytes.subarray(dataStart, dataStart + entry.compSize);
    if (entry.compMethod === 0) return compressed;
    if (entry.compMethod === 8) return await inflateRawRead(compressed);
    throw new Error("unsupported compression in " + name);
  }
  function entrySummary(zip, name) {
    const e = zip.entries[name];
    return e ? `method=${e.compMethod}, compSize=${e.compSize}` : "MISSING FROM ZIP";
  }
  // Namespace-agnostic tag lookup: most Excel-written .xlsx files bind the main
  // spreadsheetml namespace as the bare default (no prefix), but not every writer
  // does — BC's export engine, for one, doesn't — so a plain getElementsByTagName("row")
  // silently finds nothing against a document using e.g. <x:row>. Matching by local
  // name via the "*" namespace wildcard works regardless of which prefix (if any)
  // the source file happens to use.
  function tagsNS(node, localName) { return Array.from(node.getElementsByTagNameNS("*", localName)); }
  function parseSharedStrings(xmlText) {
    const doc = new DOMParser().parseFromString(xmlText, "application/xml");
    return tagsNS(doc, "si").map(si => tagsNS(si, "t").map(t => t.textContent).join(""));
  }
  function colLetterToIndex(ref) {
    const m = /^([A-Z]+)/.exec(ref);
    if (!m) return 0;
    let col = 0;
    for (const ch of m[1]) col = col * 26 + (ch.charCodeAt(0) - 64);
    return col - 1;
  }
  function parseWorksheetXml(xmlText, sharedStrings) {
    const doc = new DOMParser().parseFromString(xmlText, "application/xml");
    return tagsNS(doc, "row").map(rowEl => {
      const cells = [];
      tagsNS(rowEl, "c").forEach(c => {
        const ref = c.getAttribute("r") || "";
        const idx = ref ? colLetterToIndex(ref) : cells.length;
        const type = c.getAttribute("t");
        let value = "";
        if (type === "s") {
          const v = tagsNS(c, "v")[0];
          const si = v ? parseInt(v.textContent, 10) : NaN;
          value = !isNaN(si) ? (sharedStrings[si] || "") : "";
        } else if (type === "inlineStr") {
          const is = tagsNS(c, "is")[0];
          value = is ? tagsNS(is, "t").map(t => t.textContent).join("") : "";
        } else if (type === "b") {
          const v = tagsNS(c, "v")[0];
          value = v && v.textContent === "1" ? "TRUE" : "FALSE";
        } else {
          const v = tagsNS(c, "v")[0];
          value = v ? v.textContent : "";
        }
        while (cells.length < idx) cells.push("");
        cells[idx] = value;
      });
      return cells;
    });
  }
  async function startImportFromXlsxBuffer(buffer) {
    const decoder = new TextDecoder("utf-8");
    try {
      const zip = readZipEntries(buffer);
      const workbookBytes = await extractZipEntry(zip, "xl/workbook.xml");
      if (!workbookBytes) throw new Error("couldn't find a worksheet inside this file");
      const wbDoc = new DOMParser().parseFromString(decoder.decode(workbookBytes), "application/xml");
      const firstSheet = tagsNS(wbDoc, "sheet")[0];
      let sheetPath = "xl/worksheets/sheet1.xml";
      const rId = firstSheet && (firstSheet.getAttribute("r:id") || firstSheet.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id"));
      if (rId) {
        const relsBytes = await extractZipEntry(zip, "xl/_rels/workbook.xml.rels");
        if (relsBytes) {
          const relsDoc = new DOMParser().parseFromString(decoder.decode(relsBytes), "application/xml");
          const rel = tagsNS(relsDoc, "Relationship").find(r => r.getAttribute("Id") === rId);
          if (rel) { const target = rel.getAttribute("Target") || ""; sheetPath = target.startsWith("/") ? target.slice(1) : "xl/" + target; }
        }
      }
      let sharedStrings = [];
      const sstBytes = await extractZipEntry(zip, "xl/sharedStrings.xml");
      if (sstBytes) sharedStrings = parseSharedStrings(decoder.decode(sstBytes));
      const sheetBytes = await extractZipEntry(zip, sheetPath);
      if (!sheetBytes) throw new Error("couldn't read the worksheet data inside this file");
      const sheetXmlText = decoder.decode(sheetBytes);
      const rawRows = parseWorksheetXml(sheetXmlText, sharedStrings);
      const nonEmptyRows = rawRows.filter(r => r.some(c => (c || "").toString().trim() !== ""));
      // Diagnostic only shown if this still comes up empty — pinpoints exactly which
      // stage lost the data instead of leaving a bare "nothing found" to guess at:
      // entry names actually in the zip, raw byte counts pre-parse (0 bytes here means
      // extraction/decompression itself came back empty, not an XML-structure problem),
      // and a snippet of the decoded worksheet XML.
      const debugDetail = `entries: ${Object.keys(zip.entries).join(", ")} | sheet "${sheetPath}" (${entrySummary(zip, sheetPath)}) | sharedStrings.xml (${entrySummary(zip, "xl/sharedStrings.xml")}), decoded ${sstBytes ? sstBytes.length : 0}B -> ${sharedStrings.length} strings | worksheet decoded ${sheetBytes.length}B -> ${rawRows.length} rows | xml starts: ${JSON.stringify(sheetXmlText.slice(0, 200))}`;
      const headers = (nonEmptyRows.shift() || []).map(h => (h || "").toString().trim());
      finishParsedImport(headers, nonEmptyRows, debugDetail);
    } catch (err) {
      state.importError = "Couldn't read that .xlsx file (" + err.message + "). Try opening it in Excel and saving as CSV instead, then upload or paste that.";
      render();
    }
  }
  // New jobs land at "Order Received" with owner = coordinator, same convention
  // seeded jobs use — production ownership only diverges once the job actually
  // hands over to a team leader at the Production stage.
  // BC's own Job WIP Worksheet export is at *job task* grain — one row per job task
  // line, with the job-level columns (customer, dates, value...) repeated on every
  // row for that job. So a real file has several rows per Job No., not one; we
  // upsert the job on every matching row (idempotent — later rows just refresh the
  // same fields), and if Job Task columns are mapped, queue each row's task as a
  // triage candidate rather than a real task line — see the triage section below —
  // keyed by Job No. + Job Task No. so re-importing the same file never re-queues
  // one already confirmed or rejected in a previous triage pass.
  function runImport() {
    const d = state.importDraft;
    if (!d) return;
    let created = 0, updated = 0, tasksAdded = 0; const skipped = [], warnings = [];
    const touchedThisRun = new Set(); // job numbers already counted, so a multi-row job counts once
    d.rows.forEach((row, i) => {
      const get = f => mappedCell(row, d.mapping, f);
      const jobNumber = get("jobNumber"), name = get("name");
      if (!jobNumber || !name) { skipped.push(`Row ${i + 2}: missing job number or name — not imported.`); return; }
      const requiredDeliveryDate = parseFlexibleDate(get("requiredDeliveryDate"));
      const internalTargetDate = parseFlexibleDate(get("internalTargetDate")) || requiredDeliveryDate;
      const actualCompletionDate = parseFlexibleDate(get("actualCompletionDate"));
      const customer = get("customer"), customerNo = get("customerNo"), customerPO = get("customerPO");
      const contractValue = parseMoney(get("contractValue"));
      const jobType = get("jobType"), industryType = get("industryType");
      const bcOperationalStatus = get("bcOperationalStatus"), bcPostingStatus = get("bcPostingStatus");
      const priorityRaw = get("priority");
      const priority = PRIORITIES.find(p => p.toLowerCase() === priorityRaw.toLowerCase()) || "Medium";
      const coordinatorName = get("coordinator");
      const coordinator = coordinatorName
        ? state.users.find(u => u.name.toLowerCase() === coordinatorName.toLowerCase() || u.name.toLowerCase().includes(coordinatorName.toLowerCase()))
        : null;

      const jobKey = jobNumber.toLowerCase();
      let job = state.jobs.find(j => j.jobNumber.toLowerCase() === jobKey);
      if (job) {
        job.name = name;
        if (customer) job.customer = customer;
        if (requiredDeliveryDate) { job.requiredDeliveryDate = requiredDeliveryDate; job.dueDate = requiredDeliveryDate; }
        if (internalTargetDate) job.internalTargetDate = internalTargetDate;
        if (actualCompletionDate) job.actualCompletionDate = actualCompletionDate; // informational only — never auto-advances an existing job's stage
        if (customerNo) job.customerNo = customerNo;
        if (customerPO) job.customerPO = customerPO;
        if (contractValue != null) job.contractValue = contractValue;
        if (jobType) job.jobType = jobType;
        if (industryType) job.industryType = industryType;
        if (bcOperationalStatus) job.bcOperationalStatus = bcOperationalStatus;
        if (bcPostingStatus) job.bcPostingStatus = bcPostingStatus;
        if (priorityRaw) job.priority = priority;
        if (coordinator) job.coordinatorId = coordinator.id;
        if (!touchedThisRun.has(jobKey)) { touchedThisRun.add(jobKey); updated++; }
      } else {
        const coordinatorId = coordinator ? coordinator.id : state.currentUserId;
        // A job BC already shows as physically complete lands straight in Complete —
        // no reason to walk a decades-old finished job through eight empty stages.
        const isDone = !!actualCompletionDate;
        job = {
          id: uid("j"), jobNumber, name, customer: customer || "",
          priority, requiredDeliveryDate, internalTargetDate: internalTargetDate || requiredDeliveryDate, dueDate: requiredDeliveryDate,
          actualCompletionDate, customerNo, customerPO, contractValue, jobType, industryType, bcOperationalStatus, bcPostingStatus,
          status: isDone ? "COMPLETE" : "ACTIVE", stage: isDone ? "Complete" : "Order Received", stageEnteredAt: isDone ? actualCompletionDate : new Date(),
          coordinatorId, ownerId: coordinatorId, onHold: false, stageHistory: [], holdHistory: [],
        };
        state.jobs.push(job);
        created++;
        touchedThisRun.add(jobKey); // so a later row for this same new job doesn't also count as an "update"
        if (coordinatorName && !coordinator) warnings.push(`${jobNumber}: coordinator "${coordinatorName}" not found in Employees — left assigned to you for now.`);
      }

      // BC's task lines are generic — the same standard list shows up whether or not it
      // actually applies to this job — so an import never creates real task lines
      // directly. It queues them as candidates for a coordinator/production owner to
      // triage (see Job Board), keyed by Job No. + Job Task No. so re-importing the same
      // file never re-queues one already confirmed, and never resurrects one already
      // rejected during a previous triage pass.
      const taskName = get("jobTaskName");
      const jobTaskNo = get("jobTaskNo");
      if (taskName) {
        const bcTaskRef = `${jobNumber}#${jobTaskNo || i}`;
        const alreadyConfirmed = state.tasks.some(t => t.bcTaskRef === bcTaskRef);
        const alreadyRejected = (job.rejectedTaskRefs || []).includes(bcTaskRef);
        const alreadyQueued = (job.candidateTasks || []).some(c => c.bcTaskRef === bcTaskRef);
        if (!alreadyConfirmed && !alreadyRejected && !alreadyQueued) {
          job.candidateTasks = job.candidateTasks || [];
          job.candidateTasks.push({ bcTaskRef, name: taskName, expectedCompletionDate: requiredDeliveryDate });
          job.needsTriage = true;
          tasksAdded++;
        }
      }
    });
    d.result = { created, updated, tasksAdded, skipped, warnings };
    state.dataSource = "imported";
    state.importedAt = new Date();
    render();
  }

  /* ---- Production task lines: add/remove (Production stage only) ---- */
  // afterSeq: sequence number to insert immediately after (0 = becomes the new first
  // task line), or null to append at the end — same as the old always-append behavior.
  function addTaskLine(jobId, data, afterSeq = null) {
    const job = jobById(jobId);
    if (!job || !data.name) return;
    const existing = tasksForJob(jobId);
    const insertPos = afterSeq == null ? existing.length : Math.max(0, Math.min(afterSeq, existing.length));
    existing.forEach(t => { if (t.sequence > insertPos) t.sequence += 1; });
    const t = {
      id: uid("t"), jobId, sequence: insertPos + 1, name: data.name, priority: data.priority || "Medium",
      status: "NOT_STARTED", completionPercent: 0, startedAt: null, completedAt: null,
      expectedCompletionDate: data.expectedCompletionDate || null, originalExpectedCompletionDate: data.expectedCompletionDate || null,
      bcTaskRef: data.bcTaskRef || null, // Job No. + Job Task No. from a BC import — lets a re-import skip a task line it already created
    };
    if (data.assignType === "pool") { t.pool = data.pool; t.poolCount = data.poolCount || 1; t.assignedUserId = effectiveLeaderId("u_dave"); }
    else if (data.assignType === "vendor") { t.vendor = data.vendorName || "Vendor"; t.assignedUserId = job.ownerId || job.coordinatorId || null; }
    else t.assignedUserId = data.assignedUserId || null;
    state.tasks.push(t);
  }
  function deleteTaskLine(taskId) {
    const t = taskById(taskId);
    if (!t) return;
    state.tasks = state.tasks.filter(x => x.id !== taskId);
    tasksForJob(t.jobId).forEach((x, i) => { x.sequence = i + 1; }); // keep "Task N" contiguous
  }
  // Drag-and-drop reorder: drop the dragged line immediately before the drop target,
  // then renumber everyone in between — same "keep sequence contiguous" rule as delete.
  function reorderTaskLine(draggedId, targetId) {
    if (draggedId === targetId) return;
    const dragged = taskById(draggedId);
    const target = taskById(targetId);
    if (!dragged || !target || dragged.jobId !== target.jobId) return;
    const list = tasksForJob(dragged.jobId).filter(t => t.id !== draggedId);
    const targetIdx = list.findIndex(t => t.id === targetId);
    list.splice(targetIdx, 0, dragged);
    list.forEach((t, i) => { t.sequence = i + 1; });
  }

  /* ---- Triage: winnowing BC's generic task list down to what applies to this job ---- */
  function jobsNeedingTriage() { return state.jobs.filter(j => j.needsTriage && (j.candidateTasks || []).length); }
  function jobsNeedingTriageFor(userId) { return jobsNeedingTriage().filter(j => isOrDelegatesFor(userId, j.coordinatorId) || isOrDelegatesFor(userId, j.ownerId)); }
  function openTriage(jobId) {
    const job = jobById(jobId);
    if (!job) return;
    state.triageJobId = jobId;
    state.triageSelected = (job.candidateTasks || []).map(c => c.bcTaskRef); // default: everything selected, uncheck what doesn't apply
    render();
  }
  function closeTriage() { state.triageJobId = null; state.triageSelected = []; }
  // Selected candidates become real, unassigned task lines; everything left unchecked is
  // remembered as rejected so a later re-import never queues it again.
  function confirmTriage(jobId, selectedRefs) {
    const job = jobById(jobId);
    if (!job) return;
    (job.candidateTasks || []).forEach(cand => {
      if (selectedRefs.includes(cand.bcTaskRef)) {
        addTaskLine(jobId, { name: cand.name, priority: "Medium", assignType: "individual", assignedUserId: null, expectedCompletionDate: cand.expectedCompletionDate, bcTaskRef: cand.bcTaskRef });
      } else {
        job.rejectedTaskRefs = job.rejectedTaskRefs || [];
        job.rejectedTaskRefs.push(cand.bcTaskRef);
      }
    });
    job.candidateTasks = [];
    job.needsTriage = false;
  }

  // Job ownership: the person accountable for the job moving through every step,
  // independent of who's currently holding the ball on any one task.
  function jobsOwnedBy(userId) { return state.jobs.filter(j => j.ownerId === userId); }
  function setJobOwner(jobId, newOwnerId) {
    const job = jobById(jobId);
    if (!job || !newOwnerId) return;
    const oldOwnerId = job.ownerId;
    job.ownerId = newOwnerId;
    // Vendor/PO tasks are assigned to whoever currently owns the job — carry them
    // across on handoff so the new owner is the one chasing the supplier.
    tasksForJob(jobId).forEach(t => { if (t.vendor && t.assignedUserId === oldOwnerId) t.assignedUserId = newOwnerId; });
  }
  // Everything the owner needs to keep a job moving: its full active portfolio (one row
  // per job, current task) plus every non-complete task across those jobs that's overdue
  // or at risk — own team's work and other departments' alike, so nothing quietly slips.
  // Includes jobs owned by anyone this viewer is currently delegate-covering, live —
  // nothing on the job itself changes, so this empties out again the moment the
  // delegation ends.
  function ownerOverview(userId) {
    const ownerIds = [userId, ...delegationsTo(userId).map(d => d.fromUserId)];
    const owned = state.jobs.filter(j => ownerIds.includes(j.ownerId) && j.status === "ACTIVE");
    const portfolio = owned.map(job => {
      const current = currentTaskOf(job.id);
      const risk = current ? assessTaskRisk(current) : { level: "UNKNOWN" };
      const daysToDue = job.dueDate ? Math.ceil((job.dueDate - Date.now()) / DAY) : null;
      return { job, current, risk, daysToDue };
    }).sort((a, b) => { if (!a.job.dueDate) return 1; if (!b.job.dueDate) return -1; return a.job.dueDate - b.job.dueDate; });

    const flagged = [];
    owned.forEach(job => {
      tasksForJob(job.id).filter(t => t.status !== "COMPLETE").forEach(t => {
        const risk = assessTaskRisk(t);
        if (risk.level === "OVERDUE" || risk.level === "AT_RISK") flagged.push({ job, task: t, risk });
      });
    });
    flagged.sort((a, b) => (a.task.expectedCompletionDate ? a.task.expectedCompletionDate.getTime() : Infinity) - (b.task.expectedCompletionDate ? b.task.expectedCompletionDate.getTime() : Infinity));

    return { owned, portfolio, flagged };
  }

  // A row in the unified register: production task or non-production action, normalized.
  // coveringFor: set only when this row is showing up on someone's dashboard because
  // they're delegate-covering its real assignee, not because it's actually theirs.
  function taskToRow(t, coveringFor) {
    const job = jobById(t.jobId);
    const risk = assessTaskRisk(t);
    return {
      rowId: "task_" + t.id, type: "task", raw: t, jobId: job.id,
      category: "Production", description: `${job.jobNumber} · ${t.name}`,
      assignedUserId: t.assignedUserId, dueDate: t.expectedCompletionDate, priority: t.priority,
      statusLabel: TASK_STATUS_LABEL[t.status], flagLevel: risk.level,
      flagLabel: risk.level === "AT_RISK" ? "At risk" : risk.level === "COMPLETE" ? "Completed" : risk.level === "OVERDUE" ? "Overdue" : risk.level === "UNKNOWN" ? "No date set" : "On track",
      done: t.status === "COMPLETE", coveringFor: coveringFor || null,
    };
  }
  function actionToRow(a, coveringFor) {
    const f = statusFlag(a);
    return {
      rowId: "action_" + a.id, type: "action", raw: a, actionId: a.id,
      category: a.category, description: a.description, notes: a.notes,
      assignedUserId: a.assignedUserId, dueDate: a.dueDate ? new Date(a.dueDate + "T00:00:00") : null, priority: a.priority,
      statusLabel: a.status, flagLevel: FLAG_LEVEL_FROM_ACTION_FLAG[f], flagLabel: FLAG_LABEL_FROM_ACTION_FLAG[f],
      done: a.status === "Completed" || a.status === "Closed", coveringFor: coveringFor || null,
    };
  }
  function allRows() { return [...state.tasks.map(taskToRow), ...state.actions.map(actionToRow)]; }
  function rowAssigneeDisplay(row) {
    if (row.type === "task") return taskAssigneeDisplay(row.raw);
    const u = userById(row.assignedUserId);
    return u ? { name: u.name, sub: u.department, isVendor: false } : { name: "Unassigned", sub: "", isVendor: false };
  }

  // Mirrors the WIP tracker's idle-gap service: opens a gap when a task completes and the
  // next task in sequence hasn't started; closes it when that next task starts.
  function syncIdleGapsForTaskChange(taskId) {
    const task = taskById(taskId);
    if (!task) return;
    if (task.status === "COMPLETE") {
      const next = state.tasks.find(t => t.jobId === task.jobId && t.sequence === task.sequence + 1);
      if (!next || next.status === "NOT_STARTED" || next.status === "ON_HOLD") {
        const alreadyOpen = state.idleGaps.find(g => g.jobId === task.jobId && !g.idleEnd);
        if (!alreadyOpen) state.idleGaps.push({ id: uid("gap"), jobId: task.jobId, fromTaskId: task.id, toTaskId: next ? next.id : null, idleStart: task.completedAt || new Date(), idleEnd: null, durationMins: null });
      }
    }
    if (task.status === "IN_PROGRESS") {
      const open = state.idleGaps.find(g => g.jobId === task.jobId && !g.idleEnd);
      if (open) {
        const idleEnd = task.startedAt || new Date();
        open.idleEnd = idleEnd;
        open.durationMins = Math.max(0, Math.round((idleEnd - open.idleStart) / 60000));
        open.toTaskId = open.toTaskId || task.id;
      }
    }
  }

  /* ---- actions on production tasks ---- */
  function updatePercent(taskId, percent) {
    const t = taskById(taskId);
    if (!t) return;
    t.completionPercent = percent;
    if (t.status === "NOT_STARTED" && percent > 0) { t.status = "IN_PROGRESS"; t.startedAt = new Date(); syncIdleGapsForTaskChange(taskId); }
  }
  function completeTask(taskId) {
    const t = taskById(taskId);
    if (!t || t.status === "COMPLETE") return;
    t.status = "COMPLETE"; t.completionPercent = 100; t.completedAt = new Date();
    syncIdleGapsForTaskChange(taskId);
  }
  function reopenTask(taskId) { const t = taskById(taskId); if (!t) return; t.status = "IN_PROGRESS"; t.completedAt = null; }
  function assignTask(taskId, userId) { const t = taskById(taskId); if (t) t.assignedUserId = userId || null; }
  function assignEquipment(taskId, equipmentId) { const t = taskById(taskId); if (t) t.equipmentId = equipmentId || null; }
  function changeDueDate(taskId, newDate, reason, note) {
    const t = taskById(taskId);
    if (!t) return;
    const isFirst = !t.expectedCompletionDate;
    state.dueDateChanges.push({ id: uid("ddc"), taskId, userId: state.currentUserId, oldDate: t.expectedCompletionDate, newDate, reason, note: note || null, changedAt: new Date() });
    t.expectedCompletionDate = newDate;
    if (isFirst) t.originalExpectedCompletionDate = newDate;
  }

  /* ---- actions on non-production actions ---- */
  function setActionStatus(actionId, status) {
    const a = actionById(actionId);
    if (!a) return;
    a.status = status;
    if (status === "Completed" && !a.completionDate) a.completionDate = isoDate(new Date());
    if (status !== "Completed") a.completionDate = "";
  }
  function saveActionDraft(draft) {
    if (draft.id) {
      const a = actionById(draft.id);
      Object.assign(a, draft);
      if (a.status !== "Completed") a.completionDate = ""; else if (!a.completionDate) a.completionDate = isoDate(new Date());
    } else {
      const a = Object.assign({ id: uid("act") }, draft);
      if (a.status !== "Completed") a.completionDate = ""; else if (!a.completionDate) a.completionDate = isoDate(new Date());
      state.actions.push(a);
    }
  }
  function deleteAction(actionId) { state.actions = state.actions.filter(a => a.id !== actionId); }

  /* ============================================================
     DERIVED VIEWS
     ============================================================ */

  // Delegation makes this a true, live stand-in: while covering someone, their open
  // tasks and actions show up right alongside the viewer's own (tagged "Covering for
  // X" so it's clear whose work it originally was) — actionable with the exact same
  // controls, since those work off the task/action id, not who's looking at it. End
  // the delegation and this call simply stops including them; nothing to undo by hand.
  function getMyDashboard(userId) {
    const coveredIds = delegationsTo(userId).map(d => d.fromUserId);
    const scopeIds = [userId, ...coveredIds];
    const coveringNameFor = id => id === userId ? null : ((userById(id) || {}).name || null);

    const openTasks = state.tasks.filter(t => scopeIds.includes(t.assignedUserId) && t.status !== "COMPLETE")
      .map(t => taskToRow(t, coveringNameFor(t.assignedUserId)));
    const openActions = state.actions.filter(a => scopeIds.includes(a.assignedUserId) && a.status !== "Completed" && a.status !== "Closed")
      .map(a => actionToRow(a, coveringNameFor(a.assignedUserId)));
    const byCategory = {};
    CATEGORIES.forEach(c => byCategory[c] = []);
    openTasks.forEach(r => byCategory.Production.push(r));
    openActions.forEach(r => byCategory[r.category].push(r));
    Object.keys(byCategory).forEach(c => byCategory[c].sort((a, b) => (a.dueDate ? a.dueDate.getTime() : Infinity) - (b.dueDate ? b.dueDate.getTime() : Infinity)));

    const upcoming = [];
    state.jobs.filter(j => j.status === "ACTIVE").forEach(job => {
      const current = currentTaskOf(job.id);
      if (!current || !current.assignedUserId || scopeIds.includes(current.assignedUserId)) return;
      const next = state.tasks.find(t => t.jobId === job.id && t.sequence === current.sequence + 1);
      if (next && scopeIds.includes(next.assignedUserId)) upcoming.push({ job, current, next, risk: assessTaskRisk(current), coveringFor: coveringNameFor(next.assignedUserId) });
    });

    const all = [...openTasks, ...openActions];
    return {
      byCategory, upcoming,
      totalOpen: all.length,
      overdue: all.filter(r => r.flagLevel === "OVERDUE").length,
      atRisk: all.filter(r => r.flagLevel === "AT_RISK").length,
    };
  }

  function getManagerRollup(managerId) {
    return directReports(managerId).map(person => {
      const rows = allRows().filter(r => r.assignedUserId === person.id);
      const open = rows.filter(r => !r.done);
      return {
        staff: person,
        openCount: open.length,
        overdueCount: open.filter(r => r.flagLevel === "OVERDUE").length,
        dueSoonCount: open.filter(r => r.flagLevel === "AT_RISK").length,
        doneCount: rows.filter(r => r.done).length,
        rows: rows.sort((a, b) => (a.dueDate ? a.dueDate.getTime() : Infinity) - (b.dueDate ? b.dueDate.getTime() : Infinity)),
      };
    });
  }

  // WIP Meeting is scoped to jobs that have actually reached the Production stage —
  // everything earlier/later in the lifecycle lives on the Job Board instead, where a
  // job with no task lines yet wouldn't have a meaningful "current task" to show.
  function getJobList(filter) {
    return state.jobs.filter(j => (filter === "ALL" ? tasksForJob(j.id).length > 0 : j.stage === "Production"))
      .map(job => {
        const current = currentTaskOf(job.id);
        const ts = tasksForJob(job.id);
        const risk = current ? assessTaskRisk(current) : { level: "UNKNOWN" };
        const daysToDue = job.dueDate ? Math.ceil((job.dueDate - Date.now()) / DAY) : null;
        return { job, current, taskCount: ts.length, completedCount: ts.filter(t => t.status === "COMPLETE").length, risk, daysToDue };
      })
      .sort((a, b) => { if (!a.job.dueDate) return 1; if (!b.job.dueDate) return -1; return a.job.dueDate - b.job.dueDate; });
  }

  function getDueDateAnalytics(days) {
    const since = Date.now() - days * DAY;
    const changes = state.dueDateChanges.filter(c => c.changedAt.getTime() >= since);
    const byReason = {}; REASON_ORDER.forEach(r => byReason[r] = 0);
    changes.forEach(c => byReason[c.reason] = (byReason[c.reason] || 0) + 1);
    const byUser = {};
    changes.forEach(c => { const u = userById(c.userId); if (!u) return; byUser[u.id] = byUser[u.id] || { name: u.name, count: 0 }; byUser[u.id].count++; });
    let pushedOut = 0, pulledIn = 0;
    changes.forEach(c => { if (!c.oldDate) return; if (c.newDate > c.oldDate) pushedOut++; else if (c.newDate < c.oldDate) pulledIn++; });
    return { total: changes.length, byReason, byUser: Object.values(byUser).sort((a, b) => b.count - a.count), pushedOut, pulledIn };
  }
  function getIdleAnalytics(days) {
    const since = Date.now() - days * DAY;
    const gaps = state.idleGaps.filter(g => g.idleStart.getTime() >= since).sort((a, b) => b.idleStart - a.idleStart);
    const closed = gaps.filter(g => g.durationMins != null);
    const totalMins = closed.reduce((s, g) => s + g.durationMins, 0);
    return { gaps, openCount: gaps.length - closed.length, avgMins: closed.length ? Math.round(totalMins / closed.length) : 0, totalMins };
  }

  function getRegisterRows() {
    const f = state.register;
    let rows = allRows().filter(r => {
      if (f.category && r.category !== f.category) return false;
      if (f.assignee && r.assignedUserId !== f.assignee) return false;
      if (f.status) {
        const bucket = r.done ? "DONE" : (r.type === "task" && r.raw.status === "IN_PROGRESS") || (r.type === "action" && r.raw.status === "In Progress") ? "IN_PROGRESS" : "OPEN";
        if (bucket !== f.status) return false;
      }
      if (f.search) {
        const s = f.search.toLowerCase();
        const assignee = userById(r.assignedUserId);
        if (!(r.description.toLowerCase().includes(s) || (assignee && assignee.name.toLowerCase().includes(s)))) return false;
      }
      if (f.quick === "overdue" && r.flagLevel !== "OVERDUE") return false;
      if (f.quick === "week" && r.flagLevel !== "OVERDUE" && r.flagLevel !== "AT_RISK") return false;
      return true;
    });

    const dir = f.sortDir === "desc" ? -1 : 1;
    const priRank = { Low: 0, Medium: 1, High: 2 };
    const flagRank = { OVERDUE: 0, AT_RISK: 1, ON_TRACK: 2, UNKNOWN: 3, COMPLETE: 4 };
    rows.sort((a, b) => {
      let av, bv;
      if (f.sortKey === "dueDate") {
        av = a.dueDate ? a.dueDate.getTime() : Infinity; bv = b.dueDate ? b.dueDate.getTime() : Infinity;
      } else if (f.sortKey === "priority") { av = priRank[a.priority] ?? -1; bv = priRank[b.priority] ?? -1; }
      else if (f.sortKey === "status") { av = flagRank[a.flagLevel] ?? 9; bv = flagRank[b.flagLevel] ?? 9; }
      else if (f.sortKey === "assignedTo") { av = (userById(a.assignedUserId) || {}).name || ""; bv = (userById(b.assignedUserId) || {}).name || ""; }
      else { av = a[f.sortKey] || ""; bv = b[f.sortKey] || ""; }
      if (av < bv) return -1 * dir; if (av > bv) return 1 * dir; return 0;
    });
    return rows;
  }

  function riskBadge(level, label) {
    const map = { OVERDUE: ["bad", "Overdue"], AT_RISK: ["warn", "At risk"], ON_TRACK: ["good", "On track"], COMPLETE: ["neutral", "Completed"], UNKNOWN: ["neutral", "No date set"] };
    const [cls, def] = map[level] || map.UNKNOWN;
    return `<span class="badge ${cls}"><span class="dot"></span>${label || def}</span>`;
  }
  function stripeClass(level) { return level === "OVERDUE" ? "stripe-overdue" : level === "AT_RISK" ? "stripe-warn" : level === "COMPLETE" ? "stripe-done" : ""; }
  function priTag(p) { return p ? `<span class="pri ${p}">${p}</span>` : ""; }

  function render() {
    // Every interaction inside an open modal (a slider drag, a field edit, clicking
    // "Expected:", anything) runs through here, and renderModal() below fully replaces
    // the modal's DOM — including .modal-body, which is independently scrollable. A
    // fresh element defaults to scrollTop 0, which is what was reading as "the modal
    // jumps to the top" on every click. Carrying the scroll position across the
    // replacement fixes that for every interaction at once, not just one button.
    const oldModalBody = document.querySelector(".modal-body");
    const modalScroll = oldModalBody ? oldModalBody.scrollTop : null;
    // Same problem, same fix, for any <details> (e.g. the job lifetime panel) inside the
    // modal: a freshly-rendered <details> defaults closed, so without this, opening it
    // and then touching anything else on the modal would silently collapse it again.
    const openDetailsIdx = oldModalBody ? [...oldModalBody.querySelectorAll("details")].reduce((acc, d, i) => (d.open && acc.push(i), acc), []) : [];
    renderRailNav();
    renderViewerSelect();
    renderRailFooter();
    const el = document.getElementById("view");
    if (state.view === "me") el.innerHTML = renderMe();
    else if (state.view === "board") el.innerHTML = renderJobBoard();
    else if (state.view === "manager") el.innerHTML = renderManager();
    else if (state.view === "wip") el.innerHTML = renderWip();
    else if (state.view === "register") el.innerHTML = renderRegister();
    else if (state.view === "analytics") el.innerHTML = renderAnalytics();
    else if (state.view === "employees") el.innerHTML = renderEmployees();
    else if (state.view === "guide") el.innerHTML = renderGuide();
    renderModal();
    if (modalScroll != null) {
      const newModalBody = document.querySelector(".modal-body");
      if (newModalBody) {
        newModalBody.scrollTop = modalScroll;
        const newDetails = newModalBody.querySelectorAll("details");
        openDetailsIdx.forEach(i => { if (newDetails[i]) newDetails[i].open = true; });
      }
    }
    wireSliders();
    wireBoardDragDrop();
    wireTaskLineDragDrop();
    wireOrgChartDragDrop();
    wireTaskLineForm();
    saveState();
  }

        ${!pending && rejected ? `<div class="rejected-strip">⚠ Not approved${rejected.decisionNote ? `: “${rejected.decisionNote}”` : ""} — adjust and resubmit.</div>` : ""}
        <div class="card-foot">
          <span>Approved: <b>${t.completionPercent}%</b> · Hours logged: <b>${t.hoursLogged || 0}h</b></span>
        </div>
        <div class="hours-log-row">
          <input type="number" min="0" step="0.5" placeholder="Hours" data-hours-input="${t.id}" class="hours-input">
          <button class="btn-ghost-small" data-log-hours="${t.id}">+ Log hours</button>
        </div>
      </div>`;
  }
  function pendingTag(taskId) { return openPendingFor(taskId) ? `<span class="badge warn pending-badge">⏳ pending review</span>` : ""; }

  function renderActionCard(r) {
    const a = r.raw;
    return `
    <div class="card action-card">
      <div class="card-top">
        <div>
          <div class="ac-cat">${a.category} ${a.priority ? "· " + a.priority : ""}</div>
          <div class="ac-desc">${a.description}</div>
          ${a.notes ? `<div class="ac-notes">${a.notes}</div>` : ""}
          ${coveringChip(r.coveringFor)}
        </div>
        ${riskBadge(r.flagLevel, r.flagLabel)}
      </div>
      <div class="ac-foot">
        <span>Due: <b style="color:var(--ink)">${fmtDate(a.dueDate)}</b></span>
        <div class="ac-controls">
          <select class="ac-status-select" data-action-status="${a.id}">
            ${ACTION_STATUSES.map(s => `<option value="${s}" ${a.status === s ? "selected" : ""}>${s}</option>`).join("")}
          </select>
          <button class="icon-btn" data-edit-action="${a.id}" title="Edit">✎</button>
        </div>
      </div>
    </div>`;
  }

  /* ---- Team (manager) ---- */
  function renderCapacityPanel(leaderId) {
    const pool = WORKSHOP_POOLS[leaderId];
    const statuses = poolCapacityStatus(leaderId);
    return `
    <div class="panel" style="margin-bottom:18px;">
      <h2>${pool.departmentName} capacity</h2>
      <p style="color:var(--ink-faint); font-size:12.5px; margin:-6px 0 14px;">Headcount pools, not named people — flagged when scheduled work needs more hands than the shift has.</p>
      ${statuses.map(s => `
        <div class="cat-row">
          <div class="cat-label">${s.role}</div>
          <div class="cat-track"><div class="cat-fill" style="width:${Math.min(100, (s.demand / s.capacity) * 100)}%; background:${s.over ? "var(--accent)" : "var(--good)"}"></div></div>
          <div class="cat-count">${s.demand}/${s.capacity}</div>
          ${s.over ? `<span class="badge bad" style="margin-left:8px;">Over by ${s.demand - s.capacity}</span>` : `<span class="badge good" style="margin-left:8px;">Within capacity</span>`}
        </div>`).join("")}
    </div>`;
  }

  function renderEquipmentPanel() {
    return `
    <div class="panel" style="margin-bottom:18px;">
      <h2>Robotics equipment</h2>
      <div class="emp-list">
        ${state.robotEquipment.map(e => `
          <div class="emp-row" style="cursor:default;">
            <div style="flex:1;"><b>${e.name}</b></div>
            <div style="flex:1; color:var(--ink-faint); font-size:12.5px;">${e.capabilities.join(", ")}</div>
            <div style="flex:none;">${e.status === "Available" ? `<span class="badge good">Available</span>` : `<span class="badge warn">${e.status}</span>`}</div>
          </div>`).join("")}
      </div>
    </div>`;
  }

  function renderManager() {
    const me = userById(state.currentUserId);
    const sections = [];
    if (isManager(me.id) || leadsPool(me.id)) sections.push({ id: me.id, covering: false });
    coveringForIds(me.id).forEach(id => sections.push({ id, covering: true }));
    return `
      <div class="view-header">
        <div>
          <h1>Team Workload</h1>
          <p class="lede">Team-level rollup across production tasks and every other action category — heavy counts or a lot of red/amber may mean someone needs support or a rebalance.</p>
        </div>
        ${newActionButton()}
      </div>
      ${renderDelegationPanel()}
      ${sections.map(s => renderTeamSection(s.id, s.covering)).join("")}
      ${sections.length === 0 ? `<div class="empty-note">No team of your own right now, and nobody's delegated coverage to you.</div>` : ""}
    `;
  }
  function renderTeamSection(leaderId, covering) {
    const leader = userById(leaderId);
    if (!leader) return "";
    const rows = isManager(leaderId) ? getManagerRollup(leaderId) : [];
    const activeDelegation = covering ? delegationsFrom(leaderId).find(d => d.toUserId === state.currentUserId) : null;
    return `
      ${covering ? `
      <div class="panel" style="padding:11px 15px; margin-bottom:14px; background:var(--warn-soft); border-color:var(--warn-strong); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <span style="font-size:12.5px; color:var(--warn); font-weight:600;">🔁 Covering for ${leader.name} — ${leader.jobTitle}${activeDelegation ? `, ${activeDelegation.endDate ? `until ${fmtShort(activeDelegation.endDate)}` : "until ended"}` : ""}</span>
        ${activeDelegation ? `<button class="btn-ghost-small" data-end-delegation="${activeDelegation.id}">End coverage now</button>` : ""}
      </div>` : ""}
      ${leadsPool(leaderId) ? renderCapacityPanel(leaderId) : ""}
      ${leaderId === ROBOTICS_LEADER_ID ? renderEquipmentPanel() : ""}
      ${rows.length === 0 && leadsPool(leaderId) ? "" : `<div class="staff-list-wrap">
        ${rows.map(row => `
          <div class="staff-row">
            <button class="staff-summary" data-toggle-staff="${row.staff.id}">
              <div class="staff-id">
                <div class="staff-name">${row.staff.name}</div>
                <div class="staff-role">${row.staff.jobTitle}</div>
              </div>
              <div class="staff-metrics">
                <div class="sm-block">Open<span class="sm-num">${row.openCount}</span></div>
                <div class="sm-block sm-overdue">Overdue<span class="sm-num">${row.overdueCount}</span></div>
                <div class="sm-block sm-due">Due soon<span class="sm-num">${row.dueSoonCount}</span></div>
                <div class="sm-block sm-done">Done<span class="sm-num">${row.doneCount}</span></div>
                <span style="color:var(--ink-faint)">${state.expandedStaffId === row.staff.id ? "▲" : "▼"}</span>
              </div>
            </button>
            ${state.expandedStaffId === row.staff.id ? `<div class="staff-detail">${renderRowsTable(row.rows, false)}</div>` : ""}
          </div>`).join("")}
        ${rows.length === 0 ? `<div class="empty-note">No staff assigned to this manager yet — add them in the Employees tab.</div>` : ""}
      </div>`}
    `;
  }
  function renderDelegationPanel() {
    const all = [...state.delegations].sort((a, b) => b.startDate - a.startDate);
    return `
    <div class="panel" style="margin-bottom:18px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:${all.length ? "14px" : "0"};">
        <div>
          <h2 style="margin:0;">Delegated coverage</h2>
          <p style="color:var(--ink-faint); font-size:12.5px; margin:4px 0 0;">When a team leader is on leave or away, hand their coverage to someone else — themselves later, another team leader, or an employee stepping up. Their open tasks, actions and owned jobs immediately move onto the covering person's dashboard (tagged so it's clear where they came from) and move back off it the moment the delegation ends — nothing to reassign by hand either way. The original leader keeps their own access throughout.</p>
        </div>
        <button class="btn-secondary" data-open-delegation="1" style="flex:none;">+ New delegation</button>
      </div>
      ${all.length ? `<div class="table-wrap" style="margin-top:14px;"><table>
        <thead><tr><th>Covering for</th><th>Covered by</th><th>Since</th><th>Until</th><th>Note</th><th></th></tr></thead>
        <tbody>${all.map(d => {
          const active = isDelegationActive(d);
          const from = userById(d.fromUserId), to = userById(d.toUserId);
          return `<tr>
            <td>${from ? from.name : "—"}</td>
            <td>${to ? to.name : "—"}</td>
            <td class="mono">${fmtShort(d.startDate)}</td>
            <td>${d.endDate ? fmtShort(d.endDate) : (active ? `<span class="badge warn">Until ended</span>` : "—")}</td>
            <td>${d.note ? `<span class="desc-notes">${d.note}</span>` : ""}</td>
            <td>${active ? `<button class="btn-ghost-small" data-end-delegation="${d.id}">End now</button>` : `<span class="badge neutral">Ended</span>`}</td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>` : ""}
    </div>`;
  }

  /* ---- shared rows table (used by Team detail + register) ---- */
  function renderRowsTable(rows, withActions) {
    if (!rows.length) return `<div class="empty-note">No actions match here — nice and clear.</div>`;
    return `
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Category</th><th>Description</th><th>Assigned To</th><th>Due</th><th>Priority</th><th>Status</th>${withActions ? "<th></th>" : ""}
      </tr></thead>
      <tbody>
        ${rows.map(r => {
          const who = rowAssigneeDisplay(r);
          const clickAttr = r.type === "task" ? `data-open-job="${r.jobId}"` : (withActions ? `data-edit-action="${r.actionId}"` : "");
          return `
          <tr class="${stripeClass(r.flagLevel)} ${clickAttr ? "row-clickable" : ""}" ${clickAttr}>
            <td>${r.category}</td>
            <td>${r.description}${r.notes ? `<div class="desc-notes">${r.notes}</div>` : ""}</td>
            <td>${who.isVendor ? "🚚 " : ""}${who.name}${who.sub ? `<div class="desc-notes">${who.sub}</div>` : ""}</td>
            <td class="mono">${fmtDate(r.dueDate)}</td>
            <td>${priTag(r.priority)}</td>
            <td>${riskBadge(r.flagLevel, r.flagLabel)}${r.type === "task" ? pendingTag(r.raw.id) : ""}</td>
            ${withActions ? `<td><div class="row-actions" onclick="event.stopPropagation()">
              ${r.type === "action" ? `<button class="icon-btn" data-edit-action="${r.actionId}" title="Edit">✎</button><button class="icon-btn" data-delete-action="${r.actionId}" title="Delete">🗑</button>` : `<button class="icon-btn" data-open-job="${r.jobId}" title="View job">↗</button>`}
            </div></td>` : ""}
          </tr>`;
        }).join("")}
      </tbody>
    </table></div>`;
  }

  /* ---- Job Board (Kanban — every job, every stage, drag to advance) ---- */
  function renderJobBoard() {
    const f = state.boardFilter;
    let jobs = state.jobs.filter(j => {
      if (j.needsTriage) return false; // held out of every stage column until triaged — see the panel above the board
      if (f.search) {
        const s = f.search.toLowerCase();
        if (!(j.name.toLowerCase().includes(s) || j.jobNumber.toLowerCase().includes(s) || (j.customer || "").toLowerCase().includes(s))) return false;
      }
      if (f.priority && j.priority !== f.priority) return false;
      if (f.holdOnly && !j.onHold) return false;
      return true;
    });
    const stalled = jobs.filter(isStalled).length;
    const triageQueue = jobsNeedingTriage();
    const admin = isAdmin(state.currentUserId);
    const selectMode = admin && state.boardSelectMode;
    const selection = state.boardSelection || [];

    return `
      <div class="view-header">
        <div>
          <h1>Job Board</h1>
          <p class="lede">Every job, every stage, one screen — drag a card to move it, or click it for the full detail. This is the "where does everything actually stand" view.</p>
        </div>
        <div style="display:flex; gap:8px;">
          ${admin ? `<button class="btn-secondary" id="boardSelectModeBtn">${selectMode ? "✕ Done selecting" : "☑ Select jobs"}</button>` : ""}
          <button class="btn-secondary" data-open-import="1">⬆ Import from BC</button>
          <button class="btn-primary" data-open-new-job="1">+ New Job</button>
        </div>
      </div>
      ${selectMode ? `
      <div class="panel" style="margin-bottom:18px; padding:11px 15px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--neutral-soft); border-color:var(--line-strong);">
        <span style="font-size:12.5px; font-weight:600;">${selection.length} job${selection.length === 1 ? "" : "s"} selected</span>
        ${triageQueue.length ? `<button class="btn-ghost-small" id="boardSelectTriageBtn">Select all in Needs triage (${triageQueue.length})</button>` : ""}
        <button class="btn-ghost-small" id="boardSelectAllBtn">Select all visible</button>
        <button class="btn-ghost-small" id="boardSelectNoneBtn">Clear</button>
        <button class="btn-primary" id="boardDeleteSelectedBtn" ${selection.length ? "" : "disabled"} style="margin-left:auto; background:var(--bad); border-color:var(--bad);">🗑 Delete selected</button>
      </div>
      <p style="color:var(--ink-faint); font-size:11.5px; margin:-10px 0 16px;">A testing utility — e.g. clearing out a bad or duplicate import to re-run it. Deletes the job and any task lines on it. Can't be undone.</p>` : ""}
      ${triageQueue.length ? `
      <section class="block owner-block" style="margin-bottom:18px;">
        <div class="block-head">
          <h2>Needs triage</h2>
          <span class="badge warn" style="font-size:10.5px; padding:1px 7px;">${triageQueue.length}</span>
          <span class="block-count">Task lines came in generic from BC — pick what applies before these jobs show up on the board below.</span>
        </div>
        <div class="panel" style="padding:0; border-color:var(--warn-strong);">
          ${triageQueue.map(j => `
            <div class="approval-row" style="${selectMode ? "" : "cursor:pointer;"}" ${selectMode ? "" : `data-open-triage="${j.id}"`}>
              ${selectMode ? `<input type="checkbox" data-job-select="${j.id}" ${selection.includes(j.id) ? "checked" : ""} style="width:auto; flex:none;">` : ""}
              <div style="flex:1; min-width:0;" ${selectMode ? `data-open-triage="${j.id}"` : ""}>
                <div style="font-weight:700; font-size:13.5px;">${j.jobNumber} · ${j.name}${j.customer ? ` — ${j.customer}` : ""}</div>
                <div style="color:var(--ink-faint); font-size:12px; margin-top:3px;">${j.candidateTasks.length} candidate task line${j.candidateTasks.length === 1 ? "" : "s"} to review</div>
              </div>
              <span class="badge warn" style="flex:none;">Review →</span>
            </div>`).join("")}
        </div>
      </section>` : ""}
      <div class="toolbar">
        <input type="text" id="boardSearch" placeholder="Search job, number or customer…" value="${escapeAttr(f.search)}">
        <select id="boardPriority">
          <option value="">All priorities</option>
          ${PRIORITIES.map(p => `<option value="${p}" ${f.priority === p ? "selected" : ""}>${p}</option>`).join("")}
        </select>
        <button class="chip" id="boardHoldChip" aria-pressed="${f.holdOnly}">On hold${jobs.filter(j => j.onHold).length && !f.holdOnly ? ` (${state.jobs.filter(j => j.onHold).length})` : ""}</button>
        ${stalled ? `<span class="stall-badge">⏱ ${stalled} stalled ${STAGE_STALL_DAYS}+ days</span>` : ""}
      </div>
      <div class="board-wrap"><div class="board">
        ${STAGES.map(stage => {
          const colJobs = jobs.filter(j => j.stage === stage).sort((a, b) => (a.requiredDeliveryDate || 0) - (b.requiredDeliveryDate || 0));
          return `
          <div class="board-col" data-stage-col="${escapeAttr(stage)}">
            <div class="board-col-head"><span class="name">${stage}</span><span class="count">${colJobs.length}</span></div>
            <div class="board-cards">
              ${colJobs.map(j => boardCardHtml(j, selectMode, selection)).join("")}
            </div>
          </div>`;
        }).join("")}
      </div></div>
    `;
  }

  function boardCardHtml(job, selectMode, selection) {
    const daysToDue = job.requiredDeliveryDate ? Math.ceil((job.requiredDeliveryDate - Date.now()) / DAY) : null;
    const dueClass = daysToDue == null ? "" : daysToDue < 0 || daysToDue <= 3 ? "red" : daysToDue <= 7 ? "amber" : "";
    const owner = userById(job.ownerId);
    const coordinator = userById(job.coordinatorId);
    return `
    <div class="board-card" draggable="${!selectMode}" data-job-card="${job.id}" ${selectMode ? "" : `data-open-job="${job.id}"`}>
      <div class="bc-top">
        ${selectMode ? `<input type="checkbox" data-job-select="${job.id}" ${(selection || []).includes(job.id) ? "checked" : ""} style="width:auto; margin-top:2px;">` : ""}
        <div style="flex:1;" ${selectMode ? `data-open-job="${job.id}"` : ""}>
          <div class="bc-num">${job.jobNumber}</div>
          <div class="bc-name">${job.name}</div>
          <div class="bc-customer">${job.customer || ""}</div>
        </div>
        ${priTag(job.priority)}
      </div>
      ${job.onHold ? `<span class="hold-badge">⏸ ${job.holdCategory}</span>` : isStalled(job) ? `<span class="stall-badge">⏱ ${daysInStage(job)}d in stage</span>` : ""}
      <div class="bc-foot">
        <span>Due <span class="bc-due ${dueClass}">${fmtShort(job.requiredDeliveryDate)}</span></span>
        <span class="bc-owner">${job.stage === "Production" ? (owner ? owner.name : "Unowned") : (coordinator ? coordinator.name : "Unassigned")}</span>
      </div>
    </div>`;
  }

  function stageStepperHtml(job) {
    const idx = STAGES.indexOf(job.stage);
    return `<div class="stage-stepper">${STAGES.map((s, i) => `
      <button type="button" class="stage-step ${i < idx ? "is-done" : i === idx ? "is-current" : ""}" data-set-stage="${job.id}" data-stage-value="${escapeAttr(s)}">${s}</button>`).join("")}</div>`;
  }

  /* ---- WIP Meeting (production only, unchanged behavior) ---- */
  function renderWip() {
    const rows = getJobList(state.wipFilter);
    return `
      <div class="view-header">
        <div>
          <h1>WIP Meeting</h1>
          <p class="lede">Jobs on the shop floor right now — soonest due date first, task-level detail. For the full lifecycle across every stage, see the Job Board.</p>
        </div>
        <div class="filter-toggle">
          <button data-wip-filter="ACTIVE" aria-pressed="${state.wipFilter === "ACTIVE"}">In Production</button>
          <button data-wip-filter="ALL" aria-pressed="${state.wipFilter === "ALL"}">All (incl. complete)</button>
        </div>
      </div>
      <div class="panel table-wrap" style="padding:0;">
        <table>
          <thead><tr><th>Job</th><th>Due</th><th>Current task</th><th>Assigned to</th><th>Progress</th><th>Task risk</th></tr></thead>
          <tbody>
            ${rows.map(r => {
              const urgency = r.daysToDue == null ? "" : r.daysToDue < 0 || r.daysToDue <= 3 ? "urgency-red" : r.daysToDue <= 7 ? "urgency-amber" : "";
              const dueDaysClass = r.daysToDue == null ? "neutral" : r.daysToDue < 0 || r.daysToDue <= 3 ? "red" : r.daysToDue <= 7 ? "amber" : "neutral";
              const dueLabel = r.daysToDue == null ? "No due date" : r.daysToDue < 0 ? `${Math.abs(r.daysToDue)}d overdue` : r.daysToDue === 0 ? "Due today" : `${r.daysToDue}d left`;
              const who = r.current ? taskAssigneeDisplay(r.current) : { name: "—", sub: "" };
              return `
              <tr class="wip-row ${urgency}" data-open-job="${r.job.id}">
                <td class="job-cell"><div class="job-num">${r.job.jobNumber}</div><div class="job-name">${r.job.name}</div><div class="job-customer">${r.job.customer || ""}</div></td>
                <td class="due-cell"><div class="mono">${fmtShort(r.job.dueDate)}</div><div class="due-days ${dueDaysClass}">${dueLabel}</div></td>
                <td>${r.current && r.current.status !== "COMPLETE" ? r.current.name : `<span style="color:var(--ink-faint)">All tasks complete</span>`}</td>
                <td style="color:var(--ink-soft)">${who.isVendor ? "🚚 " : ""}${who.name}${who.sub ? `<div class="desc-notes">${who.sub}</div>` : ""}</td>
                <td><div class="progress-mini"><span class="mono pct">${r.completedCount}/${r.taskCount}</span>${r.current ? `<div class="bar"><span style="width:${r.current.completionPercent}%"></span></div><span class="pct">${r.current.completionPercent}%</span>` : ""}</div></td>
                <td>${riskBadge(r.risk.level)}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  /* ---- All Actions (company-wide register: KPIs + category bars + needs-attention + filterable/sortable table) ---- */
  const REGISTER_COLUMNS = [
    { key: "category", label: "Category" }, { key: "description", label: "Description" }, { key: "assignedTo", label: "Assigned To" },
    { key: "dueDate", label: "Due" }, { key: "priority", label: "Priority" }, { key: "status", label: "Status" },
  ];
  function renderRegister() {
    const all = allRows();
    const open = all.filter(r => !r.done);
    const overdue = all.filter(r => r.flagLevel === "OVERDUE");
    const dueSoon = all.filter(r => r.flagLevel === "AT_RISK");
    const done = all.filter(r => r.done);
    const catCounts = CATEGORIES.map(c => ({ cat: c, count: open.filter(r => r.category === c).length }));
    const maxCat = Math.max(1, ...catCounts.map(c => c.count));
    const needsAttention = overdue.sort((a, b) => (a.dueDate ? a.dueDate.getTime() : Infinity) - (b.dueDate ? b.dueDate.getTime() : Infinity)).slice(0, 6);
    const rows = getRegisterRows();
    const f = state.register;

    return `
      <div class="view-header">
        <div>
          <h1>All Actions</h1>
          <p class="lede">Every action raised across every area — production and otherwise — filterable and sortable for management review.</p>
        </div>
        ${newActionButton()}
      </div>

      <div class="kpi-row">
        <div class="kpi-card"><div class="num" style="color:var(--ink)">${open.length}</div><div class="lbl">Open Actions</div></div>
        <div class="kpi-card"><div class="num" style="color:var(--accent)">${overdue.length}</div><div class="lbl">Overdue</div></div>
        <div class="kpi-card"><div class="num" style="color:var(--warn-strong)">${dueSoon.length}</div><div class="lbl">Due in 7 Days</div></div>
        <div class="kpi-card"><div class="num" style="color:var(--good-strong)">${done.length}</div><div class="lbl">Completed</div></div>
      </div>

      <div class="panel">
        <h2>Open actions by category</h2>
        ${catCounts.map(c => `
          <div class="cat-row">
            <div class="cat-label">${c.cat}</div>
            <div class="cat-track"><div class="cat-fill" style="width:${(c.count / maxCat) * 100}%"></div></div>
            <div class="cat-count">${c.count}</div>
          </div>`).join("")}
      </div>

      <div class="panel">
        <h2>Needs attention first</h2>
        ${needsAttention.length ? renderRowsTable(needsAttention, false) : `<div class="empty-note">Nothing overdue right now — <b>nice and clear.</b></div>`}
      </div>

      <div class="panel">
        <h2>Every action</h2>
        <div class="toolbar">
          <input type="text" id="regSearch" placeholder="Search description or name…" value="${escapeAttr(f.search)}">
          <select id="regCategory">
            <option value="">All categories</option>
            ${CATEGORIES.map(c => `<option value="${c}" ${f.category === c ? "selected" : ""}>${c}</option>`).join("")}
          </select>
          <select id="regStatus">
            <option value="">All statuses</option>
            <option value="OPEN" ${f.status === "OPEN" ? "selected" : ""}>Open</option>
            <option value="IN_PROGRESS" ${f.status === "IN_PROGRESS" ? "selected" : ""}>In Progress</option>

  const FORECAST_COLUMNS = [
    { key: "job", label: "Job" },
    { key: "customer", label: "Customer" },
    { key: "stage", label: "Stage" },
    { key: "forecast", label: "Forecast" },
    { key: "window", label: "Window" },
  ];
  function sortForecastRows(rows) {
    const { key, dir } = state.forecastSort;
    const rank = { overdue: 0, m1: 1, m2: 2, m3: 3, beyond: 4, none: 5 };
    const withDate = rows.filter(r => r.forecast.date);
    const withoutDate = rows.filter(r => !r.forecast.date);
    withDate.sort((a, b) => {
      let av, bv;
      if (key === "job") { av = a.job.jobNumber; bv = b.job.jobNumber; }
      else if (key === "customer") { av = a.job.customer || ""; bv = b.job.customer || ""; }
      else if (key === "stage") { av = STAGES.indexOf(a.job.stage); bv = STAGES.indexOf(b.job.stage); }
      else if (key === "window") { av = rank[a.bucketKey]; bv = rank[b.bucketKey]; }
      else { av = a.forecast.date.getTime(); bv = b.forecast.date.getTime(); }
      const cmp = av < bv ? -1 : av > bv ? 1 : 0;
      return dir === "asc" ? cmp : -cmp;
    });
    // Jobs with no forecast date have nothing to sort by on any column — keep them
    // pinned at the end, ordered by job number, regardless of sort direction.
    withoutDate.sort((a, b) => a.job.jobNumber < b.job.jobNumber ? -1 : 1);
    return withDate.concat(withoutDate);
  }
  function renderSalesForecastPanel() {
    const buckets = getSalesForecast();
    const windowBuckets = buckets.filter(b => b.key !== "none");
    const noneCount = buckets.find(b => b.key === "none").entries.length;
    const estimateCount = buckets.reduce((n, b) => n + b.entries.filter(e => e.forecast.estimate).length, 0);
    const totalActive = buckets.reduce((n, b) => n + b.entries.length, 0);
    const rows = sortForecastRows(buckets.flatMap(b => b.entries.map(e => ({ ...e, bucketKey: b.key, bucketLabel: b.label }))));
    const f = state.forecastSort;
    return `
      <div class="panel an-card">
        <h3>Production forecast</h3>
        <div class="an-sub">${totalActive} active job${totalActive === 1 ? "" : "s"}, bucketed by forecast completion date — for sales commitments and shop-floor planning. ${estimateCount ? `<b>${estimateCount}</b> ${estimateCount === 1 ? "is" : "are"} rough estimates (on hold, or currently running behind pace) — flagged "est." below.` : ""}</div>
        <div class="idle-stats">
          ${windowBuckets.map(b => `<div class="idle-stat"><div class="n" style="${b.key === "overdue" && b.entries.length ? "color:var(--bad)" : ""}">${b.entries.length}</div><div class="l">${b.label}</div></div>`).join("")}
          ${noneCount ? `<div class="idle-stat"><div class="n">${noneCount}</div><div class="l">No forecast date</div></div>` : ""}
        </div>
        <div class="table-wrap"><table>
          <thead><tr>
            ${FORECAST_COLUMNS.map(c => `<th class="sortable" data-fsort="${c.key}">${c.label}${f.key === c.key ? `<span class="sort-arrow">${f.dir === "asc" ? "▲" : "▼"}</span>` : ""}</th>`).join("")}
          </tr></thead>
          <tbody>
            ${rows.map(({ job, forecast, bucketLabel }) => `
              <tr class="row-clickable" data-open-job="${job.id}"><td>${job.jobNumber} · ${job.name}</td><td>${job.customer || "—"}</td><td>${job.stage}</td>
                <td>${forecast.date ? fmtDate(forecast.date) : "—"}${forecast.estimate ? ` <span class="badge neutral" title="${escapeAttr(forecast.note || "")}">est.</span>` : ""}</td>
                <td>${bucketLabel}</td></tr>`).join("")}
            ${totalActive === 0 ? `<tr><td colspan="5" class="empty-note">No active jobs.</td></tr>` : ""}
          </tbody>
        </table></div>
      </div>
    `;
  }
