  // A person is a descendant of `ofId` if walking up their manager chain reaches it —
  // used to block a drag-drop that would make someone their own manager's manager.
  function isDescendantOf(candidateId, ofId) {
    let cur = userById(candidateId);
    const seen = new Set();
    while (cur && cur.managerId && !seen.has(cur.id)) {
      seen.add(cur.id);
      if (cur.managerId === ofId) return true;
      cur = userById(cur.managerId);
    }
    return false;
  }
  // A real branching tree (connector lines drawn in CSS via ::before/::after on nested
  // <ul>/<li>, not just indentation) — Admins can drag a card onto another to reassign
  // their manager. visited guards against a bad managerId loop ever hanging the page
  // instead of just rendering an odd tree.
  function renderOrgChart(admin) {
    const visited = new Set();
    function node(u, depth) {
      if (visited.has(u.id)) return "";
      visited.add(u.id);
      const reports = directReports(u.id);
      return `
        <li>
          <div class="org-card" ${admin ? `draggable="true" data-org-drag="${u.id}"` : ""}>
            <div style="font-weight:700; font-size:13px; display:flex; align-items:center; gap:6px; justify-content:center;">
              ${escapeAttr(u.name)}
              ${u.isAdmin ? `<span class="badge" style="background:var(--accent-soft); color:var(--accent-hover); font-size:10px;">Admin</span>` : ""}
            </div>
            <div style="color:var(--ink-faint); font-size:12px;">${escapeAttr(u.jobTitle || "—")}</div>
            ${u.roleType ? `<span class="badge" style="background:var(--neutral-soft); color:var(--ink-soft); font-size:10px; margin-top:4px;">${u.roleType}</span>` : ""}
          </div>
          ${reports.length ? `<ul>${reports.map(r => node(r, depth + 1)).join("")}</ul>` : ""}
        </li>`;
    }
    const roots = state.users.filter(u => !u.managerId || !userById(u.managerId));
    if (!roots.length) return `<div class="empty-note">No employees yet.</div>`;
    return `
      ${admin ? `<p style="color:var(--ink-faint); font-size:11.5px; margin:0 0 12px;">Drag a card onto another to reassign who they report to.</p>` : ""}
      <div class="org-chart-scroll"><div class="org-tree-wrap">
        ${roots.map(u => `<ul class="org-tree">${node(u, 0)}</ul>`).join("")}
      </div></div>`;
  }

  /* ---- Job modal (production) ---- */
  function renderModal() {
    const root = document.getElementById("modalRoot");
    if (state.confirmDraft) { root.innerHTML = renderConfirmModalHtml(); return; }
    if (state.importOpen) { root.innerHTML = renderImportModalHtml(); return; }
    if (state.newJobOpen) { root.innerHTML = renderNewJobModalHtml(); return; }
    if (state.delegationOpen) { root.innerHTML = renderDelegationModalHtml(); return; }
    if (state.triageJobId) { root.innerHTML = renderTriageModalHtml(); return; }
    if (state.openJobId) { root.innerHTML = renderJobModalHtml(state.openJobId); return; }
    if (state.editingActionId) { root.innerHTML = renderActionModalHtml(); return; }
    root.innerHTML = "";
  }

  // Reference-only fields carried over from a BC import that don't map onto any
  // field this tool otherwise tracks — shown so the data isn't imported and then
  // invisible, but never written back to or used in any calculation here.
  function renderBcReferencePanel(job) {
    const rows = [
      ["Customer no.", job.customerNo],
      ["Customer PO ref.", job.customerPO],
      ["Contract value", job.contractValue != null ? `${job.contractValue.toLocaleString()} (LCY)` : null],
      ["Job type", job.jobType],
      ["Industry", job.industryType],
      ["Actual completion (BC)", job.actualCompletionDate ? fmtShort(job.actualCompletionDate) : null],
      ["BC operational status", job.bcOperationalStatus],
      ["BC posting status", job.bcPostingStatus],
    ].filter(([, v]) => v);
    if (!rows.length) return "";
    return `
      <div class="panel" style="padding:12px 14px;">
        <h2 style="font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; margin:0 0 10px;">From Business Central</h2>
        <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:10px 16px;">
          ${rows.map(([label, val]) => `<div><div style="font-size:11px; color:var(--ink-faint);">${label}</div><div style="font-weight:600; font-size:13px;">${escapeAttr(String(val))}</div></div>`).join("")}
        </div>
      </div>`;
  }

  // "The path a job took" — a proportional timeline bar across every stage it's been
  // through (plus its current, still-open stage), a per-stage day count underneath, and
  // — separately, since it isn't the same thing — how much of that time was logged as
  // sitting on hold. Collapsed behind a details/summary since it's supporting detail,
  // not something you need on every glance at a job.
  function renderJobLifetimePanel(job) {
    const segments = jobStageSegments(job);
    const totalDays = segments.reduce((s, seg) => s + seg.days, 0);
    const holds = jobHoldSegments(job);
    const idleDays = jobTotalIdleDays(job);
    return `
      <details class="panel" style="padding:14px 16px;">
        <summary style="cursor:pointer; font-size:13px; font-weight:700; list-style:none; display:flex; align-items:center; justify-content:space-between;">
          <span>Job lifetime — the path this job has taken</span>
          <span style="font-weight:600; color:var(--ink-faint); font-size:12px;">${Math.round(totalDays)}d total${idleDays > 0.5 ? ` · ${Math.round(idleDays)}d idle` : ""}</span>
        </summary>
        <div style="margin-top:12px;">
          <div style="display:flex; height:14px; border-radius:7px; overflow:hidden; border:1px solid var(--line-strong);">
            ${segments.map(seg => `<div style="flex:${Math.max(seg.days, 0.15)} 0 0; background:${stageColor(seg.stage)}; ${seg.exitedAt === null ? "background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.35) 0 6px, transparent 6px 12px);" : ""}" title="${seg.stage} — ${seg.days.toFixed(1)}d${seg.exitedAt === null ? " (current)" : ""}"></div>`).join("")}
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px;">
            ${segments.map(seg => `
              <div style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);">
                <span style="width:9px; height:9px; border-radius:2px; background:${stageColor(seg.stage)}; flex:none;"></span>
                ${seg.stage}${seg.exitedAt === null ? " <b>(current)</b>" : ""} — <b>${seg.days.toFixed(1)}d</b>
              </div>`).join("")}
          </div>
          ${holds.length ? `
          <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--line);">
            <div style="font-size:12px; font-weight:700; color:var(--warn); margin-bottom:6px;">⏸ Idle / on-hold periods — ${idleDays.toFixed(1)}d total</div>
            <div style="display:flex; flex-direction:column; gap:5px;">
              ${holds.map(h => `<div style="font-size:12px; color:var(--ink-soft);"><b>${h.category}</b> — ${h.days.toFixed(1)}d${h.endedAt === null ? ` <span style="color:var(--warn); font-weight:600;">(ongoing)</span>` : ""}${h.reason ? `: ${escapeAttr(h.reason)}` : ""}</div>`).join("")}
            </div>
          </div>` : ""}
          <p style="color:var(--ink-faint); font-size:11.5px; margin:12px 0 0;">Stage time starts counting the moment this feature shipped for jobs already in flight — history before that isn't reconstructed. New jobs and every stage move from here on are tracked in full.</p>
        </div>
      </details>`;
  }

  function renderJobModalHtml(jobId) {
    const job = jobById(jobId);
    if (!job) return "";
    const tasks = tasksForJob(job.id);
    const forecast = jobForecast(job);
    return `
      <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal-panel" style="max-width:720px;">
          <div class="modal-head">
            <div>
              <div class="eyebrow">Job ${job.jobNumber} · ${job.stage}</div>
              <h2>${job.name}</h2>
              ${job.customer ? `<div class="client">${job.customer}</div>` : ""}
            </div>
            <div class="due-box">
              <div class="l">Required delivery</div>
              <div class="v">${fmtShort(job.requiredDeliveryDate)}</div>
              <button class="modal-close" id="modalCloseBtn">Close ✕</button>
            </div>
          </div>
          <div class="modal-body">
            <div class="panel" style="padding:16px;">
              <h2 style="font-size:13px;">Job details</h2>
              <div class="field-row">
                <div class="field"><label>Priority</label>
                  <select data-job-field="priority" data-job-id="${job.id}">
                    ${PRIORITIES.map(p => `<option value="${p}" ${job.priority === p ? "selected" : ""}>${p}</option>`).join("")}
                  </select>
                </div>
                <div class="field"><label>Coordinator</label>
                  <select data-job-field="coordinatorId" data-job-id="${job.id}">
                    ${state.users.map(u => `<option value="${u.id}" ${job.coordinatorId === u.id ? "selected" : ""}>${u.name}</option>`).join("")}
                  </select>
                </div>
                <div class="field"><label>Production owner</label>
                  <select data-job-owner="${job.id}">
                    ${state.users.map(u => `<option value="${u.id}" ${job.ownerId === u.id ? "selected" : ""}>${u.name}</option>`).join("")}
                  </select>
                </div>
              </div>
              <div class="field-row">
                <div class="field"><label>Required delivery (customer)</label>
                  <input type="date" data-job-date="${job.id}" data-job-field="requiredDeliveryDate" value="${job.requiredDeliveryDate ? isoDate(job.requiredDeliveryDate) : ""}">
                </div>
                <div class="field"><label>Internal target (buffer)</label>
                  <input type="date" data-job-date="${job.id}" data-job-field="internalTargetDate" value="${job.internalTargetDate ? isoDate(job.internalTargetDate) : ""}">
                </div>
                <div class="field"><label>Forecast completion</label>
                  <div style="padding:9px 0; font-weight:700;">${fmtShort(forecast.date)}${forecast.estimate ? ` <span style="font-weight:600; color:var(--warn);">(estimate)</span>` : ""}</div>
                  ${forecast.note ? `<div class="desc-notes" style="margin-top:-4px;">${forecast.note}</div>` : ""}
                </div>
              </div>
              <div class="field" style="margin-bottom:12px;"><label>Stage</label>${stageStepperHtml(job)}</div>
              <div class="field" style="margin-bottom:0;">
                <label style="display:flex; align-items:center; gap:7px; font-weight:600; cursor:pointer;">
                  <input type="checkbox" data-hold-toggle="${job.id}" ${job.onHold ? "checked" : ""} style="width:auto;"> On hold / blocked
                </label>
                ${job.onHold ? `
                <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;">
                  <select data-hold-category="${job.id}">
                    ${HOLD_CATEGORIES.map(c => `<option value="${c}" ${job.holdCategory === c ? "selected" : ""}>${c}</option>`).join("")}
                  </select>
                  <input type="text" placeholder="What's the hold, and what would clear it?" data-hold-reason="${job.id}" value="${escapeAttr(job.holdReason || "")}" style="flex:1; min-width:200px; padding:9px 10px; border:1px solid var(--line); border-radius:7px; font-size:13.5px;">
                </div>` : ""}
              </div>
            </div>
            ${renderBcReferencePanel(job)}
            ${renderJobLifetimePanel(job)}
            ${job.stage === "Production" && tasks.length > 0 && tasks.every(t => t.status === "COMPLETE") ? `
            <div class="panel" style="padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; background:var(--good-soft); border-color:var(--good-strong);">
              <span style="font-size:12.5px; color:var(--good); font-weight:600;">✓ All task lines are complete — ready to move this job on?</span>
              <button class="btn-small" data-set-stage="${job.id}" data-stage-value="NDT / Testing">Advance to NDT / Testing →</button>
            </div>` : ""}
            ${job.stage === "Production"
              ? tasks.map((task, i) => renderTaskDivider(job, i, false) + renderTaskLine(task, true)).join("") + renderTaskDivider(job, tasks.length, true)
              : `${tasks.map(task => renderTaskLine(task)).join("")}${tasks.length === 0 ? `<div class="empty-note">No production task lines yet — this job hasn't reached the Production stage.</div>` : ""}`}
          </div>
          <div class="modal-foot"><button class="btn-primary" id="modalSaveBtn">Save &amp; close</button></div>
        </div>
      </div>`;
  }

  // reorderable: only while the job is in Production, where task lines can actually be
  // added/re-sequenced — drag handle stays out of the way everywhere else.
  function renderTaskLine(task, reorderable = false) {
    const risk = assessTaskRisk(task);
    const who = taskAssigneeDisplay(task);
    const editing = state.pendingEdit && state.pendingEdit.taskId === task.id;
    const changes = state.dueDateChanges.filter(c => c.taskId === task.id).sort((a, b) => b.changedAt - a.changedAt);
    // Same approval rule everywhere a robotics task can be touched: an operator opening
    // it via the job modal gets the same submit-for-approval controls as on their card,
    // not a back door to their own direct-edit slider.
    const selfServiceRobotics = task.process && task.assignedUserId === state.currentUserId && !isRoboticsApprover(state.currentUserId) && !isOrDelegatesFor(state.currentUserId, ROBOTICS_LEADER_ID);
    const pending = selfServiceRobotics ? myOpenPending(task.id, state.currentUserId) : null;
    const rejected = selfServiceRobotics ? lastDecidedNotice(task.id, state.currentUserId) : null;
    const sliderVal = pending && pending.percent != null ? pending.percent : task.completionPercent;
    return `
      <div class="task-line" ${reorderable ? `draggable="true" data-task-drag="${task.id}"` : ""}>
        <div class="tl-top">
          ${reorderable ? `<span class="tl-drag-handle" title="Drag to reorder">⠿</span>` : ""}
          <div style="flex:1; min-width:0;">
            <div class="tl-seq">Task ${task.sequence}</div>
            <div class="tl-name">${task.name}</div>
            <div class="tl-meta">
              <span>${who.isVendor ? "🚚 " : ""}${who.name === "Unassigned" ? `<em>Unassigned</em>` : who.name}${who.sub ? ` · ${who.sub}` : ""}</span>
              ${priTag(task.priority)}
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">${riskBadge(risk.level)}${pendingTag(task.id)}${selfServiceRobotics ? "" : `<button class="icon-btn" data-delete-task="${task.id}" title="Remove task line">✕</button>`}</div>
        </div>
        <div class="tl-slider"><div class="slider-row">
          ${selfServiceRobotics
            ? `<input type="range" min="0" max="100" step="5" value="${sliderVal}" ${task.status === "COMPLETE" ? "disabled" : ""} data-pending-slider="${task.id}" style="--_val:${sliderVal}%">`
            : `<input type="range" min="0" max="100" step="5" value="${task.completionPercent}" ${task.status === "COMPLETE" ? "disabled" : ""} data-slider="${task.id}" style="--_val:${task.completionPercent}%">`}
          <span class="slider-pct" data-pct-for="${task.id}">${sliderVal}%</span>
        </div></div>
        ${task.process ? `<div class="tl-meta" style="margin-top:-2px;">Approved: <b>${task.completionPercent}%</b> · Hours logged: <b>${task.hoursLogged || 0}h</b></div>` : ""}
        ${pending ? `<div class="pending-strip">⏳ Pending approval: <b>${pending.percent}%</b>${pending.hoursDelta ? ` · +${pending.hoursDelta}h` : ""} — submitted ${fmtShort(pending.submittedAt)}</div>` : ""}
        ${!pending && rejected ? `<div class="rejected-strip">⚠ Not approved${rejected.decisionNote ? `: “${rejected.decisionNote}”` : ""} — adjust and resubmit.</div>` : ""}
        ${selfServiceRobotics ? `<div class="hours-log-row"><input type="number" min="0" step="0.5" placeholder="Hours" data-hours-input="${task.id}" class="hours-input"><button class="btn-ghost-small" data-log-hours="${task.id}">+ Log hours</button></div>` : ""}
        <div class="tl-foot">
          <div class="tl-status">Status: <b>${TASK_STATUS_LABEL[task.status].toLowerCase()}</b>
            ${selfServiceRobotics ? "" : task.status !== "COMPLETE" ? `<button class="btn-small" style="margin-left:8px" data-complete="${task.id}">Mark complete</button>` : `<button class="btn-ghost-small" style="margin-left:8px" data-reopen="${task.id}">Reopen</button>`}
          </div>
          <button class="due-link" data-edit-task="${task.id}">Expected: <b>${task.expectedCompletionDate ? fmtShort(task.expectedCompletionDate) : "Set date"}</b></button>
        </div>
        ${editing ? renderEditPanel(task, changes) : ""}
        ${task.pool || selfServiceRobotics ? "" : task.process ? `
        <div class="tl-reassign">Operator:
          <select data-reassign="${task.id}">
            <option value="">Unassigned</option>
            ${staffWithCapability(task.process).map(u => `<option value="${u.id}" ${u.id === task.assignedUserId ? "selected" : ""}>${u.name}</option>`).join("")}
          </select>
          Cell:
          <select data-equipment="${task.id}">
            <option value="">Unassigned</option>
            ${equipmentWithCapability(task.process).map(e => `<option value="${e.id}" ${e.id === task.equipmentId ? "selected" : ""}>${e.name}${e.status !== "Available" ? " (" + e.status + ")" : ""}</option>`).join("")}
          </select>
        </div>` : `
        <div class="tl-reassign">Reassign:
          <select data-reassign="${task.id}">
            <option value="">Unassigned</option>
            ${state.users.map(u => `<option value="${u.id}" ${u.id === task.assignedUserId ? "selected" : ""}>${u.name}</option>`).join("")}
          </select>
        </div>`}
      </div>`;
  }

  function renderEditPanel(task, changes) {
    const p = state.pendingEdit;
    const dateVal = p.date || (task.expectedCompletionDate ? isoDate(task.expectedCompletionDate) : "");
    return `
      <div class="edit-panel">
        <div class="row2">
          <input type="date" value="${dateVal}" data-edit-date="${task.id}">
          <select data-edit-reason="${task.id}">
            <option value="">Reason for change…</option>
            ${REASON_ORDER.map(r => `<option value="${r}" ${p.reason === r ? "selected" : ""}>${REASON_LABELS[r]}</option>`).join("")}
          </select>
        </div>
        <input type="text" placeholder="Optional note" value="${p.note ? escapeAttr(p.note) : ""}" data-edit-note="${task.id}">
        <div class="edit-actions">
          <button class="btn-ghost-small" data-cancel-edit="${task.id}">Cancel</button>
          <button class="btn-small" data-save-edit="${task.id}" ${!p.reason || !p.date ? "disabled" : ""}>Save</button>
        </div>
        ${changes.length ? `<div class="edit-history">Last changed ${fmtShort(changes[0].changedAt)} by ${userById(changes[0].userId).name} — ${REASON_LABELS[changes[0].reason]}${changes.length > 1 ? ` · ${changes.length} changes total` : ""}</div>` : ""}
      </div>`;
  }

  // The one place a coordinator/team leader breaks a job into task lines — only
  // offered once a job reaches Production. Equipment for a robotics task isn't
  // picked here; it starts unassigned and gets set via the existing reassign
  // controls on the line once it exists, same as reassigning any other task.
  //
  // Rendered as a divider between every pair of task lines (and before the first /
  // after the last) rather than one button at the bottom — hover any gap to insert a
  // line exactly there, instead of always appending and manually dragging it into
  // place. The trailing divider (after the last line, or the only one when there are
  // none yet) stays visibly labeled "+ Add task line" so that path isn't hidden behind
  // a hover.
  function renderTaskDivider(job, afterSeq, isLast) {
    if (state.addTaskLineOpenFor === job.id && state.addTaskLineInsertAt === afterSeq) {
      return renderAddTaskLineForm(job, afterSeq);
    }
    if (isLast) {
      return `<button class="btn-secondary" data-toggle-add-task="${job.id}" data-insert-after="${afterSeq}">+ Add task line</button>`;
    }
    return `<button type="button" class="task-line-divider" data-toggle-add-task="${job.id}" data-insert-after="${afterSeq}" title="Insert a task line here"><span>+</span></button>`;
  }
  function renderAddTaskLineForm(job, afterSeq) {
    const pools = WORKSHOP_POOLS.u_dave.roles.map(r => r.role);
    return `
      <div class="edit-panel">
        <div class="row2">
          <input type="text" id="newTaskName" placeholder="Task name" style="flex:2; min-width:180px;">
          <select id="newTaskPriority">${PRIORITIES.map(p => `<option ${p === "Medium" ? "selected" : ""}>${p}</option>`).join("")}</select>
          <input type="date" id="newTaskExpected" title="Expected completion (optional)">
        </div>
        <div class="row2">
          <select id="newTaskAssignType">
            <option value="individual">Assign to a person</option>
            <option value="pool">Welding Workshop pool</option>
            <option value="vendor">Vendor / 3rd party</option>
          </select>
          <div id="taskAssignIndividual"><select id="newTaskAssignee"><option value="">Unassigned</option>${state.users.map(u => `<option value="${u.id}">${u.name}</option>`).join("")}</select></div>
          <div id="taskAssignPool" style="display:none;"><span style="display:flex; gap:6px;">
            <select id="newTaskPool">${pools.map(p => `<option>${p}</option>`).join("")}</select>
            <input type="number" id="newTaskPoolCount" min="1" value="1" style="width:64px;" title="Headcount">
          </span></div>
          <div id="taskAssignVendor" style="display:none;"><input type="text" id="newTaskVendor" placeholder="Vendor name"></div>
        </div>
        <div class="edit-actions">
          <button class="btn-ghost-small" data-toggle-add-task="${job.id}" data-insert-after="${afterSeq}">Cancel</button>
          <button class="btn-small" data-add-task-line="${job.id}" data-insert-after="${afterSeq}">Add task line</button>
        </div>
      </div>`;
  }

  /* ---- Action create/edit modal (non-production, spec field order) ---- */
  function renderActionModalHtml() {
    const d = state.actionDraft;
    const isNew = state.editingActionId === "new";
    return `
      <div class="modal-backdrop" id="modalBackdrop">
        <form class="modal-panel" id="actionForm" style="max-width:480px; padding:0;">
          <div style="padding:26px 26px 0;"><h3 style="margin:0 0 18px; font-size:17px;">${isNew ? "New action" : "Edit action"}</h3></div>
          <div style="padding:0 26px; overflow-y:auto;">
            <div class="field-row">
              <div class="field"><label>Category</label><select id="af_category">${CATEGORIES.map(c => `<option value="${c}" ${d.category === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>
              <div class="field"><label>Priority</label><select id="af_priority">${PRIORITIES.map(p => `<option value="${p}" ${d.priority === p ? "selected" : ""}>${p}</option>`).join("")}</select></div>
            </div>
            <div class="field" style="margin-bottom:12px;"><label>Description</label><textarea id="af_description" required>${escapeAttr(d.description)}</textarea></div>
            <div class="field-row">
              <div class="field"><label>Assigned to</label><select id="af_assignedTo" required><option value="">Select…</option>${state.users.map(u => `<option value="${u.id}" ${d.assignedUserId === u.id ? "selected" : ""}>${u.name}</option>`).join("")}</select></div>
              <div class="field"><label>Raised by</label><input type="text" id="af_raisedBy" value="${escapeAttr(d.raisedBy)}"></div>
            </div>
            <div class="field-row">
              <div class="field"><label>Date raised</label><input type="date" id="af_dateRaised" value="${d.dateRaised}"></div>
              <div class="field"><label>Due date</label><input type="date" id="af_dueDate" value="${d.dueDate}" required></div>
            </div>
            <div class="field-row">
              <div class="field"><label>Status</label><select id="af_status">${ACTION_STATUSES.map(s => `<option value="${s}" ${d.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
              ${d.status === "Completed" ? `<div class="field"><label>Completion date</label><input type="date" id="af_completionDate" value="${d.completionDate || isoDate(new Date())}"></div>` : ""}
            </div>
            <div class="field" style="margin-bottom:16px;"><label>Notes</label><textarea id="af_notes">${escapeAttr(d.notes || "")}</textarea></div>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:8px; padding:16px 26px 26px; border-top:1px solid var(--line); margin-top:4px;">
            <button type="button" class="btn-secondary" id="actionCancelBtn">Cancel</button>
            <button type="submit" class="btn-primary">${isNew ? "Add action" : "Save changes"}</button>
          </div>
        </form>
      </div>`;

  function draftFromForm() {
    return {
      category: document.getElementById("af_category").value,
      priority: document.getElementById("af_priority").value,
      description: document.getElementById("af_description").value.trim(),

  /* ---- job board drag-and-drop (native HTML5 DnD, card -> column = stage change) ---- */
  function wireBoardDragDrop() {
    document.querySelectorAll(".board-card[draggable]").forEach(card => {
      card.addEventListener("dragstart", e => {
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", card.dataset.jobCard);
      });
      card.addEventListener("dragend", () => card.classList.remove("dragging"));
    });
    document.querySelectorAll("[data-stage-col]").forEach(col => {
      col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("drag-over"); });
      col.addEventListener("dragleave", () => col.classList.remove("drag-over"));
      col.addEventListener("drop", e => {
        e.preventDefault();
        col.classList.remove("drag-over");
        const jobId = e.dataTransfer.getData("text/plain");
        if (jobId) { setJobStage(jobId, col.dataset.stageCol); render(); }
      });
    });
  }
  // Reorder task lines within a job's Production list — drop one line onto another to
  // move the dragged one in immediately before it. Deliberately a different
  // dataTransfer payload (task ids, not job ids) so a stray drag can't cross-wire with
  // the Job Board's own drag-and-drop if both were ever visible at once.
  function wireTaskLineDragDrop() {
    document.querySelectorAll(".task-line[draggable]").forEach(line => {
      line.addEventListener("dragstart", e => {
        line.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("application/x-task-line", line.dataset.taskDrag);
      });
      line.addEventListener("dragend", () => line.classList.remove("dragging"));
      line.addEventListener("dragover", e => { if (e.dataTransfer.types.includes("application/x-task-line")) { e.preventDefault(); line.classList.add("drag-over-line"); } });
      line.addEventListener("dragleave", () => line.classList.remove("drag-over-line"));
      line.addEventListener("drop", e => {
        e.preventDefault();
        line.classList.remove("drag-over-line");
        const draggedId = e.dataTransfer.getData("application/x-task-line");
        if (draggedId) { reorderTaskLine(draggedId, line.dataset.taskDrag); render(); }
      });
    });
  }
  // Org chart drag-and-drop: drop a card onto another to make that the new manager.
  // Rejects dropping onto yourself or one of your own reports (cycle guard), flagged
  // live on dragover rather than only failing silently after the drop.
  function wireOrgChartDragDrop() {
    document.querySelectorAll(".org-card[draggable]").forEach(card => {
      card.addEventListener("dragstart", e => {
        card.classList.add("dragging");
        draggingOrgUserId = card.dataset.orgDrag;
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("application/x-org-user", card.dataset.orgDrag);
      });
      card.addEventListener("dragend", () => { card.classList.remove("dragging"); draggingOrgUserId = null; });
      card.addEventListener("dragover", e => {
        if (!e.dataTransfer.types.includes("application/x-org-user")) return;
        e.preventDefault();
        const draggedId = draggingOrgUserId;
        const targetId = card.dataset.orgDrag;
        const invalid = draggedId && (draggedId === targetId || isDescendantOf(targetId, draggedId));
        card.classList.toggle("drag-invalid", !!invalid);
        card.classList.toggle("drag-over-card", !invalid);
      });
      card.addEventListener("dragleave", () => { card.classList.remove("drag-over-card", "drag-invalid"); });
      card.addEventListener("drop", e => {
        e.preventDefault();
        card.classList.remove("drag-over-card", "drag-invalid");
        const draggedId = e.dataTransfer.getData("application/x-org-user");
        const targetId = card.dataset.orgDrag;
        if (!draggedId || draggedId === targetId || isDescendantOf(targetId, draggedId)) return;
        const u = userById(draggedId);
        if (u) u.managerId = targetId;
        render();
      });
    });
  }
  // dragover fires far too often (and without dataTransfer.getData access mid-drag,
  // for security) to read the dragged id from the event itself — dragstart stashes it
  // here once, purely for the live valid/invalid-drop highlight above.
  let draggingOrgUserId = null;

  // Toggling "assign to a person / pool / vendor" on the add-task-line form just

  function wireTaskLineForm() {

  document.addEventListener("click", e => {
    const navBtn = e.target.closest("[data-nav]");
    if (navBtn) { state.view = navBtn.dataset.nav; render(); return; }

    const openJob = e.target.closest("[data-open-job]");
    if (openJob) { state.openJobId = openJob.dataset.openJob; render(); return; }

    const completeBtn = e.target.closest("[data-complete]");
    if (completeBtn) { completeTask(completeBtn.dataset.complete); render(); return; }
    const reopenBtn = e.target.closest("[data-reopen]");
    if (reopenBtn) { reopenTask(reopenBtn.dataset.reopen); render(); return; }

    const editTaskBtn = e.target.closest("[data-edit-task]");
    if (editTaskBtn) {
      const id = editTaskBtn.dataset.editTask; const t = taskById(id);
      state.pendingEdit = { taskId: id, date: t.expectedCompletionDate ? isoDate(t.expectedCompletionDate) : "", reason: "", note: "" };
      render(); return;
    }
    const cancelEdit = e.target.closest("[data-cancel-edit]");
    if (cancelEdit) { state.pendingEdit = null; render(); return; }
    const saveEdit = e.target.closest("[data-save-edit]");
    if (saveEdit) {
      const p = state.pendingEdit;
      if (p && p.date && p.reason) { changeDueDate(p.taskId, new Date(p.date + "T00:00:00"), p.reason, p.note); state.pendingEdit = null; render(); }
      return;
    }

    const toggleStaff = e.target.closest("[data-toggle-staff]");
    if (toggleStaff) { const id = toggleStaff.dataset.toggleStaff; state.expandedStaffId = state.expandedStaffId === id ? null : id; render(); return; }

    const wipFilter = e.target.closest("[data-wip-filter]");
    if (wipFilter) { state.wipFilter = wipFilter.dataset.wipFilter; render(); return; }

    const sortTh = e.target.closest("[data-sort]");
    if (sortTh) {
      const key = sortTh.dataset.sort;
      if (state.register.sortKey === key) state.register.sortDir = state.register.sortDir === "asc" ? "desc" : "asc";
      else { state.register.sortKey = key; state.register.sortDir = "asc"; }
      render(); return;
    }
    const fsortTh = e.target.closest("[data-fsort]");
    if (fsortTh) {
      const key = fsortTh.dataset.fsort;
      if (state.forecastSort.key === key) state.forecastSort.dir = state.forecastSort.dir === "asc" ? "desc" : "asc";
      else state.forecastSort = { key, dir: "asc" };
      render(); return;
    }
    const quickChip = e.target.closest("[data-quick]");
    if (quickChip) { const q = quickChip.dataset.quick; state.register.quick = state.register.quick === q ? "" : q; render(); return; }

    if (e.target.id === "boardHoldChip") { state.boardFilter.holdOnly = !state.boardFilter.holdOnly; render(); return; }

    if (e.target.id === "boardSelectModeBtn") {
      state.boardSelectMode = !state.boardSelectMode;
      state.boardSelection = [];
      render(); return;
    }
    if (e.target.id === "boardSelectAllBtn") {
      state.boardSelection = [...new Set(state.jobs.filter(j => !j.needsTriage).map(j => j.id))];
      render(); return;
    }
    if (e.target.id === "boardSelectTriageBtn") {
      state.boardSelection = [...new Set([...state.boardSelection, ...jobsNeedingTriage().map(j => j.id)])];
      render(); return;
    }
    if (e.target.id === "boardSelectNoneBtn") { state.boardSelection = []; render(); return; }
    if (e.target.id === "boardDeleteSelectedBtn") {
      const ids = state.boardSelection;
      if (!ids.length) return;
      askConfirm(`Delete ${ids.length} job${ids.length === 1 ? "" : "s"} and all their task lines? This can't be undone.`, () => {
        deleteJobs(ids);
        state.boardSelectMode = false;
      });
      return;
    }

    const stageStepBtn = e.target.closest("[data-set-stage]");
    if (stageStepBtn) { setJobStage(stageStepBtn.dataset.setStage, stageStepBtn.dataset.stageValue); render(); return; }

    const approveBtn = e.target.closest("[data-approve-update]");
    if (approveBtn) { approvePendingUpdate(approveBtn.dataset.approveUpdate); render(); return; }
    const rejectBtn = e.target.closest("[data-reject-update]");
    if (rejectBtn) { rejectPendingUpdate(rejectBtn.dataset.rejectUpdate); render(); return; }
    const logHoursBtn = e.target.closest("[data-log-hours]");
    if (logHoursBtn) {
      const taskId = logHoursBtn.dataset.logHours;
      const input = document.querySelector(`input[data-hours-input="${taskId}"]`);
      const val = input ? parseFloat(input.value) : NaN;
      if (!isNaN(val) && val > 0) { submitRoboticsUpdate(taskId, { hoursDelta: val }); render(); }
      return;
    }

    const newActionBtn = e.target.closest("[data-new-action]");
    if (newActionBtn) { openNewAction(); return; }
    const editActionBtn = e.target.closest("[data-edit-action]");
    if (editActionBtn) { openEditAction(editActionBtn.dataset.editAction); return; }
    const deleteActionBtn = e.target.closest("[data-delete-action]");
    if (deleteActionBtn) { deleteAction(deleteActionBtn.dataset.deleteAction); render(); return; }
    if (e.target.id === "actionCancelBtn") { closeActionModal(); return; }

    const openImportBtn = e.target.closest("[data-open-import]");
    if (openImportBtn) { state.importOpen = true; state.importDraft = null; state.importError = null; render(); return; }
    const gotoImportBtn = e.target.closest("[data-goto-import]");
    if (gotoImportBtn) { state.view = "board"; state.importOpen = true; state.importDraft = null; state.importError = null; render(); return; }
    if (e.target.id === "importCloseBtn" || e.target.id === "importCloseBtn2") { state.importOpen = false; state.importDraft = null; render(); return; }
    if (e.target.id === "importBackBtn") { state.importDraft = null; render(); return; }
    if (e.target.id === "importDoneBtn") { state.importOpen = false; state.importDraft = null; state.view = "board"; render(); return; }
    if (e.target.id === "importParseBtn") {
      const fileInput = document.getElementById("importFileInput");
      const file = fileInput && fileInput.files && fileInput.files[0];
      if (file) {
        // Instant proof the click registered, before any async work starts — a slow
        // read must never look identical to nothing having happened. Every path below
        // ends in a render() (success or error), which naturally replaces this button,
        // so there's nothing to manually reset.
        e.target.disabled = true; e.target.textContent = "Reading file…";
        const reader = new FileReader();
        reader.onload = () => {
          // No dialogs anywhere in this path (this page can run inside a sandboxed
          // frame where alert()/confirm() are silently no-ops) — every outcome, error
          // included, is real page state that always ends in a render().
          try {
            const bytes = new Uint8Array(reader.result);
            // Sniff the actual bytes rather than trust the filename — a zip (.xlsx) always
            // starts with this 4-byte signature; anything else is read as plain text.
            const isZip = bytes.length > 4 && bytes[0] === 0x50 && bytes[1] === 0x4b && bytes[2] === 0x03 && bytes[3] === 0x04;
            if (isZip) {
              startImportFromXlsxBuffer(reader.result).catch(err => {
                state.importError = "Something went wrong reading that file: " + (err && err.message ? err.message : err);
                render();
              });
            } else {
              startImportFromText(new TextDecoder("utf-8").decode(bytes));
            }
          } catch (err) {
            state.importError = "Something went wrong reading that file: " + (err && err.message ? err.message : err);
            render();
          }
        };
        reader.onerror = () => { state.importError = "Couldn't read that file — try pasting the data instead."; render(); };
        reader.readAsArrayBuffer(file);
      } else {
        // No file selected — note this fires with an empty FileList both when nothing
        // was ever chosen AND after this modal has re-rendered once already (a fresh
        // file input has no memory of a prior selection), so a second click here after
        // an earlier attempt needs the file re-selected, not just re-clicking Continue.
        const pasted = document.getElementById("importPasteArea").value;
        if (!pasted.trim()) { state.importError = "Choose a file or paste data first — if you'd already picked a file, this screen re-appearing means it needs to be re-selected."; render(); return; }
        startImportFromText(pasted);
      }
      return;
    }
    if (e.target.id === "importRunBtn") { runImport(); return; }

    const openNewJobBtn = e.target.closest("[data-open-new-job]");
    if (openNewJobBtn) { openNewJob(); return; }
    if (e.target.id === "newJobCancelBtn") { state.newJobOpen = false; state.newJobDraft = null; render(); return; }

    const openDelegationBtn = e.target.closest("[data-open-delegation]");
    if (openDelegationBtn) { openDelegation(); return; }
    if (e.target.id === "delegationCancelBtn") { state.delegationOpen = false; state.delegationDraft = null; render(); return; }
    const endDelegationBtn = e.target.closest("[data-end-delegation]");
    if (endDelegationBtn) {
      const dg = state.delegations.find(x => x.id === endDelegationBtn.dataset.endDelegation);
      if (dg) dg.endDate = new Date();
      render(); return;
    }

    const openTriageBtn = e.target.closest("[data-open-triage]");
    if (openTriageBtn) { openTriage(openTriageBtn.dataset.openTriage); return; }
    if (e.target.id === "triageCloseBtn") { closeTriage(); render(); return; }
    if (e.target.id === "triageSelectAll") { const job = jobById(state.triageJobId); state.triageSelected = (job.candidateTasks || []).map(c => c.bcTaskRef); render(); return; }
    if (e.target.id === "triageDeselectAll") { state.triageSelected = []; render(); return; }
    if (e.target.id === "triageConfirmBtn") {
      const jobId = state.triageJobId;
      confirmTriage(jobId, state.triageSelected);
      closeTriage();
      render(); return;
    }

    const toggleAddTask = e.target.closest("[data-toggle-add-task]");
    if (toggleAddTask) {
      const id = toggleAddTask.dataset.toggleAddTask;
      const afterSeq = Number(toggleAddTask.dataset.insertAfter);
      const alreadyOpenHere = state.addTaskLineOpenFor === id && state.addTaskLineInsertAt === afterSeq;
      state.addTaskLineOpenFor = alreadyOpenHere ? null : id;
      state.addTaskLineInsertAt = alreadyOpenHere ? null : afterSeq;
      render(); return;
    }
    const addTaskBtn = e.target.closest("[data-add-task-line]");
    if (addTaskBtn) {
      const jobId = addTaskBtn.dataset.addTaskLine;
      const afterSeq = Number(addTaskBtn.dataset.insertAfter);
      const name = document.getElementById("newTaskName").value.trim();
      if (!name) { document.getElementById("newTaskName").focus(); return; }
      const expectedVal = document.getElementById("newTaskExpected").value;
      addTaskLine(jobId, {
        name, priority: document.getElementById("newTaskPriority").value,
        assignType: document.getElementById("newTaskAssignType").value,
        assignedUserId: document.getElementById("newTaskAssignee").value,
        pool: document.getElementById("newTaskPool").value,
        poolCount: Number(document.getElementById("newTaskPoolCount").value) || 1,
        vendorName: document.getElementById("newTaskVendor").value.trim(),
        expectedCompletionDate: expectedVal ? new Date(expectedVal + "T00:00:00") : null,
      }, afterSeq);
      state.addTaskLineOpenFor = null;
      state.addTaskLineInsertAt = null;
      render(); return;
    }
    const deleteTaskBtn = e.target.closest("[data-delete-task]");
    if (deleteTaskBtn) { const id = deleteTaskBtn.dataset.deleteTask; askConfirm("Remove this task line? This can't be undone.", () => deleteTaskLine(id)); return; }

    const deleteEmpBtn = e.target.closest("[data-delete-emp]");
    if (deleteEmpBtn) {
      const id = deleteEmpBtn.dataset.deleteEmp;
      state.users = state.users.filter(u => u.id !== id);
      state.users.forEach(u => { if (u.managerId === id) u.managerId = null; });
      if (state.currentUserId === id) state.currentUserId = state.users[0].id;
      render(); return;
    }
    if (e.target.id === "addEmployeeBtn") {
      state.users.push({ id: uid("u"), name: "New employee", jobTitle: "", department: "", managerId: null, roleType: null, isAdmin: false });
      render(); return;
    }
    const empViewBtn = e.target.closest("[data-emp-view]");
    if (empViewBtn) { state.employeesView = empViewBtn.dataset.empView; render(); return; }

    if (e.target.id === "confirmCancelBtn") { state.confirmDraft = null; render(); return; }
    if (e.target.id === "confirmOkBtn") {
      const cb = state.confirmDraft && state.confirmDraft.onConfirm;
      state.confirmDraft = null;
      if (cb) cb();
      render();
      return;
    }

    if (e.target.id === "modalCloseBtn" || e.target.id === "modalSaveBtn") { closeJobModal(); return; }
    if (e.target.id === "modalBackdrop") {
      if (state.confirmDraft) { state.confirmDraft = null; render(); }
      else if (state.importOpen) { state.importOpen = false; state.importDraft = null; render(); }
      else if (state.newJobOpen) { state.newJobOpen = false; state.newJobDraft = null; render(); }
      else if (state.delegationOpen) { state.delegationOpen = false; state.delegationDraft = null; render(); }
      else if (state.triageJobId) { closeTriage(); render(); }
      else if (state.openJobId) closeJobModal();
      else if (state.editingActionId) closeActionModal();
      return;
    }
  });

  document.addEventListener("submit", e => {
    if (e.target.id === "actionForm") {
      e.preventDefault();
      const draft = draftFromForm();
      if (!draft.description || !draft.assignedUserId || !draft.dueDate) return;
      draft.id = state.editingActionId === "new" ? null : state.editingActionId;
      saveActionDraft(draft);
      closeActionModal();
    }
    if (e.target.id === "newJobForm") {
      e.preventDefault();
      const jobNumber = document.getElementById("nj_jobNumber").value.trim();
      const name = document.getElementById("nj_name").value.trim();
      const requiredDeliveryDateStr = document.getElementById("nj_requiredDeliveryDate").value;
      if (!jobNumber || !name || !requiredDeliveryDateStr) return;
      if (state.jobs.some(j => j.jobNumber.toLowerCase() === jobNumber.toLowerCase())) {
        state.newJobDraft = { jobNumber, name, error: `Job number "${jobNumber}" already exists — open it from the Job Board instead.` };
        render(); return;
      }
      const requiredDeliveryDate = new Date(requiredDeliveryDateStr + "T00:00:00");
      const coordinatorId = document.getElementById("nj_coordinatorId").value;
      state.jobs.push({
        id: uid("j"), jobNumber, name, customer: document.getElementById("nj_customer").value.trim(),
        priority: document.getElementById("nj_priority").value,
        requiredDeliveryDate, internalTargetDate: requiredDeliveryDate, dueDate: requiredDeliveryDate,
        status: "ACTIVE", stage: "Order Received", stageEnteredAt: new Date(),
        coordinatorId, ownerId: coordinatorId, onHold: false, stageHistory: [], holdHistory: [],
      });
      state.dataSource = "imported"; state.importedAt = state.importedAt || new Date();
      state.newJobOpen = false; state.newJobDraft = null;
      render();
    }
    if (e.target.id === "delegationForm") {
      e.preventDefault();
      const fromUserId = document.getElementById("dg_fromUserId").value;
      const toUserId = document.getElementById("dg_toUserId").value;
      const startDateStr = document.getElementById("dg_startDate").value;
      const endDateStr = document.getElementById("dg_endDate").value;
      if (!fromUserId || !toUserId || !startDateStr) return;
      if (fromUserId === toUserId) {
        state.delegationDraft = Object.assign({}, state.delegationDraft, { toUserId, error: "Covering-for and covered-by need to be different people." });
        render(); return;
      }
      const startDate = new Date(startDateStr + "T00:00:00");
      const endDate = endDateStr ? new Date(endDateStr + "T00:00:00") : null;
      if (endDate && endDate < startDate) {
        state.delegationDraft = Object.assign({}, state.delegationDraft, { toUserId, error: "End date can't be before the start date." });
        render(); return;
      }
      state.delegations.push({
        id: uid("dg"), fromUserId, toUserId, startDate, endDate,
        note: document.getElementById("dg_note").value.trim(), createdAt: new Date(),
      });
      state.delegationOpen = false; state.delegationDraft = null;
      render();
    }
  });

  document.addEventListener("change", e => {
    if (e.target.matches("input[data-slider]")) { updatePercent(e.target.dataset.slider, Number(e.target.value)); render(); return; }
    if (e.target.matches("input[data-pending-slider]")) { submitRoboticsUpdate(e.target.dataset.pendingSlider, { percent: Number(e.target.value) }); render(); return; }
    if (e.target.id === "viewerSelect") {
      state.currentUserId = e.target.value;
      if (!isManager(state.currentUserId) && !leadsPool(state.currentUserId) && coveringForIds(state.currentUserId).length === 0 && state.view === "manager") state.view = "me";
      render(); return;
    }
    if (e.target.id === "dg_fromUserId") { state.delegationDraft.fromUserId = e.target.value; render(); return; }
    if (e.target.matches("select[data-reassign]")) { assignTask(e.target.dataset.reassign, e.target.value || null); render(); return; }
    if (e.target.matches("select[data-equipment]")) { assignEquipment(e.target.dataset.equipment, e.target.value || null); render(); return; }
    if (e.target.matches("select[data-job-owner]")) { setJobOwner(e.target.dataset.jobOwner, e.target.value); render(); return; }
    if (e.target.matches("input[data-edit-date]")) { state.pendingEdit.date = e.target.value; render(); return; }
    if (e.target.matches("select[data-edit-reason]")) { state.pendingEdit.reason = e.target.value; render(); return; }
    if (e.target.matches("input[data-edit-note]")) { state.pendingEdit.note = e.target.value; return; }

    if (e.target.matches("select[data-action-status]")) { setActionStatus(e.target.dataset.actionStatus, e.target.value); render(); return; }
    if (e.target.matches("select#af_status")) { state.actionDraft.status = e.target.value; render(); return; }

    if (e.target.id === "regSearch") { state.register.search = e.target.value; render(); return; }
    if (e.target.id === "regCategory") { state.register.category = e.target.value; render(); return; }
    if (e.target.id === "boardPriority") { state.boardFilter.priority = e.target.value; render(); return; }
    if (e.target.matches("select[data-import-map]")) { state.importDraft.mapping[e.target.dataset.importMap] = Number(e.target.value); render(); return; }
    if (e.target.matches("select[data-job-field]")) { setJobField(e.target.dataset.jobId, e.target.dataset.jobField, e.target.value); render(); return; }
    if (e.target.matches("input[data-job-date]")) { setJobField(e.target.dataset.jobDate, e.target.dataset.jobField, e.target.value ? new Date(e.target.value + "T00:00:00") : null); render(); return; }
    if (e.target.matches("input[data-hold-toggle]")) {
      const jobId = e.target.dataset.holdToggle;
      const job = jobById(jobId);
      setJobHold(jobId, e.target.checked, job.holdCategory || HOLD_CATEGORIES[0], job.holdReason || "");
      render(); return;
    }
    if (e.target.matches("select[data-hold-category]")) { setJobField(e.target.dataset.holdCategory, "holdCategory", e.target.value); render(); return; }
    if (e.target.matches("input[data-triage-toggle]")) {
      const ref = e.target.dataset.triageToggle;
      state.triageSelected = e.target.checked ? [...state.triageSelected, ref] : state.triageSelected.filter(r => r !== ref);
      render(); return;
    }
    if (e.target.matches("input[data-job-select]")) {
      const id = e.target.dataset.jobSelect;
      state.boardSelection = e.target.checked ? [...new Set([...state.boardSelection, id])] : state.boardSelection.filter(x => x !== id);
      render(); return;
    }
    if (e.target.matches("input[data-hold-reason]")) { setJobField(e.target.dataset.holdReason, "holdReason", e.target.value); return; }
    if (e.target.id === "regStatus") { state.register.status = e.target.value; render(); return; }
    if (e.target.id === "regAssignee") { state.register.assignee = e.target.value; render(); return; }

    const empField = e.target.closest("[data-emp-field]");
    if (empField) {
      const u = userById(empField.dataset.empId);
      if (u) u[empField.dataset.empField] = empField.value || (empField.dataset.empField === "managerId" ? null : "");
      render(); return;
    }
    if (e.target.matches("input[data-emp-admin]")) {
      const u = userById(e.target.dataset.empAdmin);
      // Never let the directory end up with zero Admins from in here — the last one
      // has to hand it to someone else first, not just uncheck themselves into a corner.
      if (u && !e.target.checked && u.isAdmin && state.users.filter(x => x.isAdmin).length <= 1) {
        askConfirm("This is the only Admin left — grant it to someone else before removing it here.", () => {});
        render(); return;
      }
      if (u) u.isAdmin = e.target.checked;
      render(); return;
    }
  });
  // Keep search inputs responsive without losing focus/caret on every keystroke.
  document.addEventListener("input", e => {
    if (e.target.id === "regSearch") { state.register.search = e.target.value; rerenderViewPreservingFocus("register", renderRegister, "regSearch"); }
    if (e.target.id === "boardSearch") { state.boardFilter.search = e.target.value; rerenderViewPreservingFocus("board", renderJobBoard, "boardSearch"); }
  });
  function rerenderViewPreservingFocus(view, renderFn, inputId) {
    if (state.view !== view) return;
    const el = document.getElementById("view");
    const scrollX = window.scrollY;
    el.innerHTML = renderFn();
    window.scrollTo(0, scrollX);
    const input = document.getElementById(inputId);
    if (input) { input.focus(); const v = input.value; input.value = ""; input.value = v; }
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    const msg = state.dataSource === "imported"
      ? "This will permanently discard your imported jobs and every change you've made, and restore the built-in sample data. Continue?"
      : "Reset the demo back to its starting sample data?";
    askConfirm(msg, () => {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
      state = freshState();
    });
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if (state.confirmDraft) { state.confirmDraft = null; render(); }
      else if (state.importOpen) { state.importOpen = false; state.importDraft = null; render(); }
      else if (state.newJobOpen) { state.newJobOpen = false; state.newJobDraft = null; render(); }
      else if (state.delegationOpen) { state.delegationOpen = false; state.delegationDraft = null; render(); }
      else if (state.triageJobId) { closeTriage(); render(); }
      else if (state.openJobId) closeJobModal();
      else if (state.editingActionId) closeActionModal();
    }
  });

  const persisted = loadPersistedState();
  state = persisted || freshState();
  if (!persisted) state.view = "guide"; // true first run in this browser — start with onboarding
  render();
})();
</script>
